  # ── Nhóm 5: soạn thảo trong chat — CÂU HỎI GIỮ NGUYÊN, CÁCH CHẤM ĐỔI ở Phase
  #    14 (2026-09-18): hành vi đúng nay là một bản thảo thật (`ban_thao`), chứ
  #    không phải `huong_dan_soan_thao` (chỉ sang biểu mẫu) như spec 2026-09-06.
  #    Trần đo được: `eval/run_trap.chay` gọi graph không có `user_sub`, nên
  #    khách chỉ tới được lời mời đăng nhập (`soan_thao_hoi.can_dang_nhap`) —
  #    bằng chứng "mô hình soạn thật" nằm ở tests/test_agents/. ───────────────
  - id: trap-soan-01
    cau_hoi: "soạn cho tôi hợp đồng nghỉ việc"
