# Ứng viên tập mẫu — CHƯA AI DUYỆT.
#
# Cùng khuôn `eval/datasets/golden_qa_candidates.yaml`: máy dựng, người duyệt.
# Đọc từng tài liệu, đối chiếu từng nhãn bằng mắt, sửa chỗ sai, rồi đổi tên tệp
# này thành `manifest.yaml` và đặt `da_nguoi_duyet: true` kèm tên bạn.
#
# KHÔNG đổi cờ mà chưa soát: `run_tai_lieu` in "nhãn người duyệt: CHƯA" lên đầu
# bảng, và một con số không có người đứng sau thì không đưa vào báo cáo được.
#
# Sáu mục này chỉ phủ hai loại có trường bắt buộc (`hdld`, `hop_dong_thu_viec`).
# Spec đòi 20–30 tài liệu phủ các loại chính — phần còn lại là việc tay.
#
# Dựng lại tệp .docx: `python eval/datasets/tai_lieu_mau/dung_mau.py`
da_nguoi_duyet: false
duyet_boi: ""
items:
