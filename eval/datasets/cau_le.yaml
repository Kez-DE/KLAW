# Câu chạy qua toàn đồ thị ngoài ba bộ có runner riêng (golden, bẫy, mơ hồ):
#   python -m eval.run_cau_le --bo dat|live --out PATH
#
# Mỗi mục là {nhom, cau_hoi}. `cau_hoi` là một chuỗi = một câu, trạng thái mới; là một
# danh sách = MỘT hội thoại, lượt sau mang lịch sử của các lượt trước, nhãn `<nhom>_<k>`.
#
# dat: câu tranh chấp nhà đất — lời thường, không nêu văn bản, ngoài lĩnh vực lao động;
#   đo việc viết lại truy vấn và khoanh vùng lĩnh vực (kết quả cũ: kho-luat/bm-nha-dat.json).
# live: bộ thông tin nội bộ (quyết định 2026-09-30 mục 11): 11 câu đòi thông tin nội bộ
#   (10 chỉ hỏi nội bộ, 1 câu ghép với tranh chấp đất), một hội thoại hai lượt mà lượt hai
#   hỏi nội bộ sau một câu luật, 6 câu hợp lệ không được chặn. Thứ tự giữ đúng
#   kho-luat/bm-live.json (19 lượt) để so từng hàng.
