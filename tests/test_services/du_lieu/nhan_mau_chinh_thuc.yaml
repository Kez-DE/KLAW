# (thiết kế `khuon-mau-thiet-ke.md` §7 "Recorded labels"). Mỗi dòng là một đoạn của
# mẫu theo thứ tự đọc (bảng đầu trang và khối ký: cột trái rồi cột phải), đã bỏ dãy
# chấm, chỉ số chú thích "(n)", khung Công báo/dòng chú thích phụ lục, và gộp khoảng
# trắng. `bo_qua` kể chữ của tệp gốc KHÔNG dựng lại, kèm lý do — không gì bị bỏ lặng lẽ.
