# Chữ tĩnh của mỗi khuôn mẫu `nguon.loai: mau_chinh_thuc`, chép từ tệp chính thức
# (thiết kế `khuon-mau-thiet-ke.md` §7 "Recorded labels"). Mỗi dòng là một đoạn của
# mẫu theo thứ tự đọc (bảng đầu trang và khối ký: cột trái rồi cột phải), đã bỏ dãy
# chấm, chỉ số chú thích "(n)", khung Công báo/dòng chú thích phụ lục, và gộp khoảng
# trắng. `bo_qua` kể chữ của tệp gốc KHÔNG dựng lại, kèm lý do — không gì bị bỏ lặng lẽ.
# `test_khuon_mau_registry.py` dựng từng mục (không điều khoản nào) và so dãy đoạn
# của bản dựng với `nhan`, sau khi bỏ "……" và gộp khoảng trắng như trên.
# Dấu "." sau chỗ trống cuối của "Theo đề nghị của …" và "- Lưu: VT, …" không vẽ được
# trên mẫu (dãy chấm chạy tới lề) nhưng CHỮ Phụ lục I đòi (Công báo tr. 25: dòng căn cứ
# cuối "kết thúc bằng dấu chấm (.)"; tr. 30: dòng "Lưu" của Nơi nhận "cuối cùng là dấu
# chấm (.)"; Mẫu 1.2 in "- Lưu: VT,...9...10."). Nó giữ được khi điền nhờ `khuon_mau.NOI`.
