name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # Eight API tests outside the integration lane still open a real Postgres
    # (quota, auth and gate tests). Give them one with the same extensions the
    # migrations need, migrated before pytest runs.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: klaw, POSTGRES_PASSWORD: klaw, POSTGRES_DB: klaw }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://klaw:klaw@localhost:5432/klaw

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The same document tools as the Dockerfile, so tests gated on soffice,
      # pdftoppm or tesseract run here instead of skipping (owner, 2026-09-26).
      - name: Install document tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer poppler-utils tesseract-ocr tesseract-ocr-vie \
            fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Apply migrations to the test database
        run: python -c "from src.services.db import run_migrations; print(len(run_migrations()), 'migrations')"

      - name: Run tests
        run: pytest tests/ -v --tb=short -m "not integration and not pending_review"
        env:
          APP_ENV: test
          # The suite must not see a real Supabase project or an API key.
          KLAW_SUPABASE_URL: ""
          KLAW_API_KEY: ""

  cms:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: klaw_cms_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: cms } }
    env:
      DATABASE_URI: postgres://postgres:postgres@localhost:5432/klaw_cms_test
      PAYLOAD_SECRET: ci-secret-not-used-elsewhere
      KLAW_API_URL: http://klaw.test/api/v1
      # >= 16 ký tự để bundle.spec.ts kiểm được bí mật không lọt .next/static
      KLAW_ADMIN_API_KEY: ci-khoa-thu-nghiem-khong-dung-o-dau-khac
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: cms/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: cms/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm build
      - run: pnpm test

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      # typecheck, lint, every scripts/kiem-*.ts, the contrast self-check and the
      # production build. kiem-khung probes :8000 and skips the live comparison
      # when no backend answers, so this needs no service container.
      - run: npm run kiem
