# Checklist nội dung của THOẢ THUẬN BẢO VỆ BÍ MẬT KINH DOANH, BÍ MẬT CÔNG NGHỆ
# (NDA trong quan hệ lao động) — TT 10/2020/TT-BLĐTBXH Đ4.2 a-e, thi hành BLLĐ
# Đ21.2.
#
# Đ4.2 dùng chữ "CÓ THỂ gồm những nội dung chủ yếu sau" — sáu mục này là nội
# dung mà cơ quan ban hành liệt kê, không phải nội dung bắt buộc theo nghĩa
# Đ21.1 của HĐLĐ. Hệ quả cho người đọc báo cáo soát: một mục thiếu ở đây nghĩa
# là thoả thuận CHƯA ĐẦY ĐỦ theo hướng dẫn, không phải TRÁI LUẬT. Ghi rõ ở đây
# vì `check_completeness` không phân biệt hai mức đó, và ghi chú này là chỗ duy
# nhất sự khác biệt còn được nói ra.
#
# Mọi can_cu đã tự tra DB thật (không chép từ trí nhớ):
#   SELECT duong_dan, noi_dung FROM provisions
#    WHERE duong_dan LIKE '10/2020/TT-BLĐTBXH > Điều 4%';
loai: thoa_thuan_bao_mat
ten: "thoả thuận bảo vệ bí mật kinh doanh, bí mật công nghệ"
tieu_de: "THOẢ THUẬN BẢO VỆ BÍ MẬT KINH DOANH, BÍ MẬT CÔNG NGHỆ"

# KHÔNG rule nào. Phép soát của mẫu này là completeness, đúng và đủ: năm rule
