# lương, mức lương vùng) hoặc một điều cấm của việc giao kết HĐLĐ — không cái
# nào đo được một thoả thuận bảo mật. `cam_phat_tien_nld` gần nhất nhưng vẫn
# sai chế định: Đ127.2 cấm phạt tiền THAY CHO XỬ LÝ KỶ LUẬT, còn TT10 Đ4.3 dẫn
# chính việc xử lý vi phạm thoả thuận sang pháp luật dân sự, nơi phạt vi phạm
# hợp đồng là hợp pháp (BLDS Đ418).
