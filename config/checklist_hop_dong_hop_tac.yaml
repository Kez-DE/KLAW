# Checklist nội dung của HỢP ĐỒNG HỢP TÁC (hợp tác kinh doanh không thành lập
# pháp nhân) — BLDS Đ505, chín khoản, mỗi mục một khoản riêng.
#
# Đ504.1 định nghĩa: các cá nhân, pháp nhân "cùng đóng góp tài sản, công sức để
# thực hiện công việc nhất định, cùng hưởng lợi và cùng chịu trách nhiệm" —
# tức KHÔNG lập pháp nhân mới. Mẫu này không dùng cho hợp đồng liên doanh có
# thành lập doanh nghiệp; đó là chế định của Luật Doanh nghiệp và Luật Đầu tư.
#
# Đ504.2 buộc hợp đồng hợp tác phải lập thành VĂN BẢN — nên can_cu_chi_tiet trỏ
# vào Đ504, điều kiện hình thức của chính loại hợp đồng này.
#
# Mọi can_cu đã tự tra DB thật (không chép từ trí nhớ):
#   SELECT duong_dan, noi_dung FROM provisions
#    WHERE duong_dan ~ '^91/2015/QH13 > Điều 50[45]';
loai: hop_dong_hop_tac
ten: "hợp đồng hợp tác kinh doanh"
tieu_de: "HỢP ĐỒNG HỢP TÁC KINH DOANH"

# KHÔNG rule nào. Năm rule hiện có đều thuộc chế định lao động. BLDS không đặt
# ngưỡng số nào cho hợp đồng hợp tác (khác Đ468 của hợp đồng vay, nơi có trần
# lãi suất tra bảng được).
rules: []

can_cu_goc: "91/2015/QH13 > Điều 505"
can_cu_chi_tiet: "91/2015/QH13 > Điều 504"

# Bốn khoản mang chữ "NẾU CÓ" ngay trong chính văn Đ505 (khoản 3, 4, 7, 8).
# Đây không phải suy diễn: luật tự đánh dấu chúng là điều kiện. Một hợp đồng
# hợp tác chỉ góp tiền, không góp sức lao động, không cử người đại diện chung
# vẫn là một hợp đồng đầy đủ — báo "chan" cho bốn mục này là dựng khuyết điểm
# ở nơi luật không đòi.
khong_bat_buoc:
  can_cu: "91/2015/QH13 > Điều 505"
  ghi_chu: >
    Khoản 3, 4, 7, 8 của Đ505 đều ghi "nếu có" trong chính văn — điều kiện, không
    bắt buộc. Vắng mặt không được báo là thiếu.
  keys: [tai_san_dong_gop, suc_lao_dong, nguoi_dai_dien, tham_gia_rut_khoi]

muc:
  - {stt: 1, key: muc_dich_thoi_han, ten: "Mục đích, thời hạn hợp tác", can_cu: "91/2015/QH13 > Điều 505 > Khoản 1", tu_khoa: ["mục đích hợp tác", "thời hạn hợp tác"]}
  - {stt: 2, key: cac_ben, ten: "Họ tên, nơi cư trú của cá nhân; tên, trụ sở của pháp nhân", can_cu: "91/2015/QH13 > Điều 505 > Khoản 2", tu_khoa: ["thông tin các bên", "nơi cư trú", "trụ sở của pháp nhân"]}
  - {stt: 3, key: tai_san_dong_gop, ten: "Tài sản đóng góp (nếu có)", can_cu: "91/2015/QH13 > Điều 505 > Khoản 3", tu_khoa: ["tài sản đóng góp", "phần vốn góp"]}
  - {stt: 4, key: suc_lao_dong, ten: "Đóng góp bằng sức lao động (nếu có)", can_cu: "91/2015/QH13 > Điều 505 > Khoản 4", tu_khoa: ["bằng sức lao động", "góp công sức"]}
  - {stt: 5, key: phan_chia, ten: "Phương thức phân chia hoa lợi, lợi tức", can_cu: "91/2015/QH13 > Điều 505 > Khoản 5", tu_khoa: ["phân chia hoa lợi", "hoa lợi, lợi tức", "phân chia lợi nhuận"]}
  - {stt: 6, key: quyen_nghia_vu_tv, ten: "Quyền, nghĩa vụ của thành viên hợp tác", can_cu: "91/2015/QH13 > Điều 505 > Khoản 6", tu_khoa: ["quyền, nghĩa vụ của thành viên", "quyền và nghĩa vụ của thành viên", "quyền và nghĩa vụ của các bên", "quyền, nghĩa vụ của các bên"]}
  - {stt: 7, key: nguoi_dai_dien, ten: "Quyền, nghĩa vụ của người đại diện (nếu có)", can_cu: "91/2015/QH13 > Điều 505 > Khoản 7", tu_khoa: ["người đại diện", "đại diện của các thành viên"]}
  - {stt: 8, key: tham_gia_rut_khoi, ten: "Điều kiện tham gia và rút khỏi hợp đồng hợp tác (nếu có)", can_cu: "91/2015/QH13 > Điều 505 > Khoản 8", tu_khoa: ["rút khỏi hợp đồng hợp tác", "điều kiện tham gia"]}
  - {stt: 9, key: cham_dut, ten: "Điều kiện chấm dứt hợp tác", can_cu: "91/2015/QH13 > Điều 505 > Khoản 9", tu_khoa: ["điều kiện chấm dứt hợp tác", "chấm dứt hợp tác"]}
