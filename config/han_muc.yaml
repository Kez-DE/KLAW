# Hạn mức theo gói (spec 2026-09-07 vo-ung-dung-va-tai-khoan §4). Đây là DỮ LIỆU,
# không phải code: đổi số là đổi file này. Quy ước: 0 = không cho lượt nào (nghĩa
# đen, không phải "không giới hạn"); "không giới hạn" = một số lớn (>= 100000).
#
# Đếm bằng SỐ LƯỢT gọi LLM thật của tài khoản trên `traces`: không tính lượt trả
# lời từ bộ đệm (cache_hit), câu ngoài phạm vi (out_of_scope) và lượt lỗi (loi).
# Tra cứu văn bản, soát văn bản, biểu mẫu không bao giờ tính.

goi_mac_dinh: free
# Mốc "ngày" và "tháng" tính theo múi giờ này, không theo UTC.
mui_gio: Asia/Ho_Chi_Minh

goi:
  free:
    hoi_dap_ngay: 100
    soan_thao_ngay: 3
    soan_thao_thang: 20
    luot_moi_phien: 30
  pro:
    hoi_dap_ngay: 500
    # Không giới hạn (quy ước ở đầu file: >= 100000). Quyết định của chủ dự án
    # 2026-09-17: gói Cá nhân thôi đếm số bản thảo dựng mỗi ngày.
    soan_thao_ngay: 100000
    soan_thao_thang: 100000
    luot_moi_phien: 100000

# Lá chắn chống lạm dụng: cưỡng chế với 429 nói thật, KHÔNG hiện thanh đo.
# Pro không còn lá chắn ngày riêng: 500/ngày nay là hạn mức thật (spec 2026-09-09 §5).
# `free_hoi_dap_thang` = 100 × 31, KHÔNG phải 100 × 30: cửa sổ tháng là THÁNG LỊCH
# (`bao_ve.moc_thang` = `moc_ngay().replace(day=1)`), nên bảy tháng trong năm có 31
# ngày. Để 3000 thì ở đúng bảy tháng ấy lá chắn chặn TRƯỚC hạn mức ngày, tức người
# dùng đọc con số chống lạm dụng họ chưa từng nghe tới thay vì con số họ mua.
# `ip_ngay` = 3 × 500 giữ nguyên lập luận cũ.
la_chan:
  free_hoi_dap_thang: 3100
  ip_ngay: 1500

# Khách chưa đăng nhập (chỉ khi Supabase đã cấu hình): cửa sổ 24 giờ trượt, vì
# khách không có mốc "ngày" nào gắn với tài khoản.
khach:
  hoi_dap_24h: 10
  ip_24h: 30

# Chu kỳ gói trả phí, tính từ lúc duyệt yêu cầu.
chu_ky_pro_ngay: 30

# Đọc tài liệu người dùng (spec 2026-09-15 §FR-036, §FR-037).
#
# Đây là cái PHANH thay cho trần thời gian. Quyết định của chủ dự án 2026-09-15:
# bỏ trần thời gian vì "điều khách hàng muốn là ra được câu trả lời" — nên một
# lần đọc được phép chạy lâu, nhưng KHÔNG được phép tốn vô hạn. Trần chi phí
# ngày (`KLAW_TRAN_CHI_PHI_NGAY_USD`) dùng CHUNG cho mọi người dùng, nên nếu chỉ
# dựa vào nó thì một tài liệu dị dạng của một người làm cạn hạn mức của tất cả.
#
# `chi_phi_usd` cho MỘT lần đọc một tài liệu. Ước theo số ký tự trước khi gọi mô
# hình, và đối chiếu lại bằng chi phí thật sau khi gọi.
#
# `so_lan_thu` là trần số lần RÚT LẠI có trả tiền trên một tài liệu (FR-037).
# Trần này từng bị bỏ vì không giữ tệp thì thử lại là tải lên lại, đã bị
# `tai_lieu_ngay` đếm. Từ quyết định 2026-09-26 tệp ở lại làm khuôn gốc và rút
# lại theo loại (`POST /tai-lieu/{id}/doc-lai`) KHÔNG trừ `tai_lieu_ngay`, nên
# trần này là thứ duy nhất chặn số lượt gọi mô hình trên một tệp. Rút "tổng
# quát" không gọi mô hình nên không tốn lượt.
tai_lieu:
  # 0.10 = 50.000 ký tự theo `usd_moi_nghin_ky_tu`: đủ cho trọn một tài liệu
  # 10 trang, trần số trang của quyết định 2026-09-26 (không cắt ngầm).
  chi_phi_usd: 0.10
  # 3 = giá trị trần này mang trước khi bị bỏ (commit 51d5e4d).
  so_lan_thu: 3
  # Số tài liệu đọc được mỗi ngày, theo gói (FR-004). Đọc một tài liệu tốn hơn
  # một câu hỏi, nên số nhỏ hơn hạn mức hỏi đáp.
  theo_goi:
    free:
      tai_lieu_ngay: 5
    pro:
      # Không giới hạn. Quyết định của chủ dự án 2026-09-17.
      #
      # ĐỌC KỸ TRƯỚC KHI COPY SANG GÓI KHÁC: con số này là cái phanh BẢO VỆ
      # TRẦN CHI PHÍ CHUNG (`KLAW_TRAN_CHI_PHI_NGAY_USD`, mặc định 2 USD/ngày,
      # cưỡng chế ở `bao_ve.kiem_tran_chi_phi_ngay`). Trần chung không chia theo
      # người, nên bỏ phanh ở đây nghĩa là một tài khoản pro đọc đủ nhiều tài
      # liệu lớn sẽ làm cạn ngân sách ngày của MỌI người dùng. Trần mỗi tài liệu
      # (`chi_phi_usd`) vẫn chặn một tệp dị dạng, nhưng không chặn số lượng.
      tai_lieu_ngay: 100000
  # Ước chi phí: USD trên một nghìn ký tự của tài liệu. Con số khởi đầu, chỉnh
  # lại khi có số đo thật từ `traces.rut_du_kien_cost_usd`.
  # ponytail: ước tuyến tính theo độ dài, nâng lên đếm token thật nếu lệch nhiều.
  usd_moi_nghin_ky_tu: 0.002
