# Bộ quy tắc kiểm tính hợp pháp — mỗi rule là DỮ LIỆU, không phải mã nguồn.
# Người chỉnh sửa file này không cần biết lập trình: thêm hoặc sửa một rule
# là sửa YAML, không đụng tới src/services/rules.py.
#
# can_cu PHẢI khớp CHÍNH XÁC một `provisions.duong_dan` đang có trong DB —
# test tích hợp trong tests/test_services/test_rules.py chặn đứng bất kỳ rule
# nào viện dẫn một điều luật không tồn tại. Đã tự tra DB (không chép từ trí
# nhớ) để lấy đúng từng can_cu bên dưới.
#
# `kiem` là một công thức nhỏ — so sánh (<= < >= > == !=), and/or/not, + - * /,
# tra bảng bằng `bang[khoa]` — được rules.py đọc và TÍNH TRỰC TIẾP, không phải
# chú thích suông. Chỉ được dùng: tên fact khai báo ở `can_facts`, và tên
# trường khác của chính rule này (vd. `gioi_han`, `ty_le_toi_thieu`,
# `bang_thang`). Không gọi hàm, không truy cập thuộc tính — biểu thức bị từ
# chối ngay lúc nạp nếu chứa cú pháp ngoài danh sách này.
rules:
  - id: thu_viec_toi_da
    can_cu: "45/2019/QH14 > Điều 25"
    muc_do: chan
    mo_ta: "Thời gian thử việc vượt mức tối đa theo chức danh"
    can_facts: [thoi_gian_thu_viec_ngay, nhom_chuc_danh]
    gioi_han:
      quan_ly_doanh_nghiep: 180
      cao_dang_tro_len: 60
      trung_cap_cnkt_nghiep_vu: 30
      cong_viec_khac: 6
    kiem: thoi_gian_thu_viec_ngay <= gioi_han[nhom_chuc_danh]

  - id: luong_thu_viec_toi_thieu
    can_cu: "45/2019/QH14 > Điều 26"
    muc_do: chan
    mo_ta: "Tiền lương thử việc thấp hơn 85% mức lương của công việc"
    can_facts: [luong_thu_viec, luong_chinh_thuc]
    ty_le_toi_thieu: 0.85
    kiem: luong_thu_viec >= ty_le_toi_thieu * luong_chinh_thuc

  - id: luong_toi_thieu_vung
    can_cu: "293/2025/NĐ-CP > Điều 3 > Khoản 1"
    muc_do: chan
    mo_ta: "Mức lương tháng thấp hơn lương tối thiểu vùng"
    can_facts: [luong_thang, vung]
    bang_thang: {I: 5310000, II: 4730000, III: 4140000, IV: 3700000}
    bang_gio:   {I: 25500,   II: 22700,   III: 20000,   IV: 17800}
    kiem: luong_thang >= bang_thang[vung]
    ghi_chu: >
      Danh mục địa bàn vùng I–IV nằm ở Phụ lục NĐ 293/2025, KHÔNG có trong
      documentContent và endpoint tải file trả 401 → `vung` PHẢI là input
      người dùng, không suy ra từ địa chỉ. `bang_gio` là mức theo giờ cùng
      Khoản 1, chưa có rule nào dùng — giữ lại làm dữ liệu tham chiếu cho
      rule tương lai về lao động tính lương theo giờ.

  - id: cam_phat_tien_nld
    can_cu: "45/2019/QH14 > Điều 127 > Khoản 2"
    muc_do: chan
    mo_ta: "Có điều khoản phạt tiền hoặc cắt lương thay xử lý kỷ luật"
    can_facts: [co_dieu_khoan_phat_tien]
    kiem: not co_dieu_khoan_phat_tien

  - id: cam_giu_giay_to
    can_cu: "45/2019/QH14 > Điều 17 > Khoản 1"
    muc_do: chan
    mo_ta: "Có điều khoản giữ bản chính giấy tờ tuỳ thân, văn bằng, chứng chỉ của người lao động"
    can_facts: [co_dieu_khoan_giu_giay_to]
    kiem: not co_dieu_khoan_giu_giay_to
    ghi_chu: >
      Tách khỏi `cam_dat_coc` (trước gộp chung một rule `cam_giu_giay_to_dat_coc`
      trỏ `Điều 17` trần — RỖNG THÂN, `len(btrim(noi_dung))=96` bằng đúng tiêu
      đề "Điều 17. Hành vi người sử dụng lao động không được làm khi giao kết,
      thực hiện hợp đồng lao động", không mang câu cấm nào). Một rule khẳng
      định HAI hành vi cấm (giữ giấy tờ, buộc đặt cọc) không có một can_cu nào
      trỏ đúng cả hai, nên nó buộc phải trỏ lên Điều cha — đúng nguyên nhân
      khiến trích dẫn đó rỗng, không phải một chỗ gõ vội. Tách rule theo đúng
      Khoản là cách sửa, không phải chọn đại một Khoản con cho một rule vẫn
      còn khẳng định hai việc: ghim rule "chan" hai việc vào trích dẫn của một
      việc sẽ đọc ra một độ chính xác trích dẫn không có thật.

  - id: cam_dat_coc
    can_cu: "45/2019/QH14 > Điều 17 > Khoản 2"
    muc_do: chan
    mo_ta: "Có điều khoản buộc người lao động thực hiện biện pháp bảo đảm bằng tiền hoặc tài sản khác cho việc thực hiện hợp đồng lao động"
    can_facts: [co_dieu_khoan_dat_coc]
    kiem: not co_dieu_khoan_dat_coc
    ghi_chu: >
      Đ17 còn Khoản 3 ("buộc người lao động thực hiện hợp đồng lao động để trả
      nợ") — CHƯA có rule nào phủ khoản này. Khoản 3 không kiểm được bằng hai
      fact đã có (`co_dieu_khoan_giu_giay_to`, `co_dieu_khoan_dat_coc`) vì nó
      là một hành vi cấm KHÁC, cần fact riêng — để lại cho một rule sau, không
      dựng ở đây bằng cách tái dùng nhầm fact của hai rule này.

  - id: lai_suat_vay_toi_da
    can_cu: "91/2015/QH13 > Điều 468 > Khoản 1"
    muc_do: chan
    mo_ta: "Lãi suất vay thoả thuận vượt trần 20%/năm của khoản tiền vay"
    can_facts: [lai_suat_nam_phan_tram]
    tran_phan_tram: 20
    kiem: lai_suat_nam_phan_tram <= tran_phan_tram
    ghi_chu: >
      Đ468.1 đặt trần 20%/năm cho lãi suất THOẢ THUẬN, và tuyên phần vượt quá
      "không có hiệu lực" — nên đây là rule `chan`, không phải cảnh báo.

      Chính điều luật chừa hai lối: "trừ trường hợp luật khác có liên quan quy
      định khác" (hợp đồng tín dụng của tổ chức tín dụng theo Luật Các tổ chức
      tín dụng KHÔNG chịu trần này), và Uỷ ban thường vụ Quốc hội có thể điều
      chỉnh mức trần. Vì vậy rule này chỉ được khai báo ở checklist của hợp
      đồng VAY TÀI SẢN giữa các bên dân sự — nó không nằm trong `rules:` của
      bất kỳ mẫu nào khác, và con số 20 nằm ở YAML để sửa được khi mức trần đổi
      mà không đụng Python.

  - id: so_dai_dien_doi_thoai_nsdld_toi_thieu
    can_cu: "145/2020/NĐ-CP > Điều 38 > Khoản 1"
    muc_do: chan
    mo_ta: "Số đại diện bên người sử dụng lao động tham gia đối thoại dưới mức tối thiểu 03 người"
    can_facts: [so_dai_dien_doi_thoai_nsdld]
    toi_thieu: 3
    kiem: so_dai_dien_doi_thoai_nsdld >= toi_thieu
    ghi_chu: >
      Đ38.1: người sử dụng lao động "quyết định số lượng, thành phần đại diện
      cho mình để tham gia đối thoại BẢO ĐẢM ÍT NHẤT 03 NGƯỜI, trong đó có
      người đại diện theo pháp luật ... và quy định trong quy chế dân chủ ở cơ
      sở tại nơi làm việc". Sàn cứng, nên `chan`.

      Vế "trong đó có người đại diện theo pháp luật" CỐ Ý không được kiểm ở
      đây. Nó chỉ kiểm được bằng một ô tick người dùng tự khai, mà kiểm một
      lời khai bằng chính nó không chứng minh gì — cùng lý do
      checklist_bien_ban_hop_hdqt.yaml không dựng rule tỷ lệ dự họp.

      Sàn theo quy mô lao động của BÊN NGƯỜI LAO ĐỘNG (Đ38.2 điểm a, sáu bậc
      a1-a6) cũng chưa dựng: bốn bậc giữa cho một KHOẢNG ("ít nhất từ 04 đến
      08 người"), nên một con số nằm ngoài khoảng không có nghĩa xác định là
      vi phạm, và đoán bừa cận trên là dựng ra một giới hạn luật không đặt.

  - id: nhiem_ky_bo_nhiem_toi_da
    can_cu: "59/2020/QH14 > Điều 162 > Khoản 2"
    muc_do: chan
    mo_ta: "Nhiệm kỳ bổ nhiệm vượt trần 05 năm của Luật Doanh nghiệp"
    can_facts: [co_tran_nhiem_ky_05_nam, nhiem_ky_thang]
    tran_thang: 60
    kiem: (not co_tran_nhiem_ky_05_nam) or nhiem_ky_thang <= tran_thang
    ghi_chu: >
      Trần 05 năm KHÔNG áp cho mọi quyết định bổ nhiệm. Đ162.2 đặt nó cho Giám
      đốc/Tổng giám đốc CÔNG TY CỔ PHẦN (Điều 162 nằm trong chương công ty cổ
      phần); Đ154.2 đặt trần cùng mức cho thành viên Hội đồng quản trị. Bổ
      nhiệm một trưởng phòng, một kế toán trưởng hay một người quản lý của công
      ty TNHH KHÔNG có trần nhiệm kỳ luật định nào — nên rule hỏi thẳng
      `co_tran_nhiem_ky_05_nam` thay vì tra bảng theo chức danh.
      Vì sao không dùng `tran[chuc_danh]` như `thu_viec_toi_da`: bảng đó buộc
      phải có một hàng cho "chức danh khác", và con số điền vào đó sẽ là một
      trần do tôi bịa, không phải trần của luật. Một fact bool nói đúng thứ
      luật phân biệt: có trần hay không có trần.

  - id: tran_phat_vi_pham_hop_dong
    can_cu: "36/2005/QH11 > Điều 301"
    muc_do: chan
    mo_ta: "Mức phạt vi phạm hợp đồng thương mại vượt trần 8% giá trị phần nghĩa vụ hợp đồng bị vi phạm"
    can_facts: [muc_phat_thoa_thuan, gia_tri_phan_nghia_vu_bi_vi_pham]
    ty_le_phat_toi_da: 0.08
    kiem: muc_phat_thoa_thuan <= ty_le_phat_toi_da * gia_tri_phan_nghia_vu_bi_vi_pham
    ghi_chu: >
      Đ301: mức phạt "không quá 8% GIÁ TRỊ PHẦN NGHĨA VỤ HỢP ĐỒNG BỊ VI PHẠM"
      — mẫu số là phần bị vi phạm, KHÔNG phải tổng giá trị hợp đồng. Hai fact
      tách riêng (`muc_phat_thoa_thuan`, `gia_tri_phan_nghia_vu_bi_vi_pham`) vì
      lý do đó: gộp thành một fact "tỷ lệ phần trăm" do người dùng tự tính sẽ
      để mẫu số sai lọt qua mà rule không thấy được. "nhưng không quá" là một
      trần luật định, mức cao hơn là TRÁI LUẬT chứ không phải một lựa chọn tệ,
      nên `chan` là mức đúng.

      Chính Đ301 chừa lối trừ: "trừ trường hợp quy định tại Điều 266 của Luật
      này". Đã tra: `Điều 266` trần RỖNG THÂN (`len(btrim(noi_dung))=83`,
      bằng đúng tiêu đề) — câu thật nằm ở Khoản 1: hợp đồng DỊCH VỤ GIÁM ĐỊNH
      chịu một mức phạt khác (tối đa mười lần thù lao dịch vụ giám định, không
      phải 8% giá trị phần vi phạm). Vì lối trừ đó, rule này CHỈ khai ở
      checklist của hợp đồng mua bán hàng hoá
      (`config/checklist_hop_dong_mua_ban.yaml`) — không khai ở
      `checklist_hop_dong_dich_vu.yaml`, cùng lối `lai_suat_vay_toi_da` chỉ
      khai ở checklist hợp đồng vay vì luật khác quy định khác cho tổ chức tín
      dụng.

  - id: thieu_dieu_khoan_giai_quyet_tranh_chap
    can_cu: "36/2005/QH11 > Điều 317 > Khoản 3"
    muc_do: canh_bao
    mo_ta: "Hợp đồng không có điều khoản chọn Trọng tài hoặc Toà án giải quyết tranh chấp — tranh chấp mặc định thuộc thẩm quyền Toà án, các bên mất lựa chọn Trọng tài"
    can_facts: [co_dieu_khoan_giai_quyet_tranh_chap]
    kiem: co_dieu_khoan_giai_quyet_tranh_chap
    ghi_chu: >
      `canh_bao`, KHÔNG `chan`: Đ317 chỉ LIỆT KÊ bốn hình thức giải quyết
      tranh chấp (Khoản 1 thương lượng, Khoản 2 hoà giải, Khoản 3 trọng tài
      hoặc toà án) — nó không đặt ra nghĩa vụ hợp đồng phải CHỨA một điều
      khoản giải quyết tranh chấp. Mã hoá việc thiếu thành `chan` là dựng một
      khẳng định pháp lý mà điều luật không đặt ra, đúng loại đòi quá luật hệ
      thống này tồn tại để chặn (cùng lý do BLDS không có điều nào liệt kê nội
      dung bắt buộc của hợp đồng nói chung). `mo_ta` nói hệ quả — mất quyền
      chọn Trọng tài, mặc định về Toà án — chứ không nói "trái luật".

      can_cu trỏ Khoản 3, KHÔNG trỏ `Điều 317` trần: đã tra, `Điều 317` trần
      chỉ có dòng tiêu đề (`len(btrim(noi_dung))=41`, bằng đúng tiêu đề "Điều
      317. Hình thức giải quyết tranh chấp"), trong khi Khoản 3 mới mang câu
      thật nêu đích danh Trọng tài và Toà án — đúng hai cơ quan cảnh báo này
      nói các bên sẽ mất quyền chọn.

# Nhãn tiếng Việt + kiểu dữ liệu cho từng fact — phần DUY NHẤT không thể suy
# ra từ cấu trúc `kiem:` (nhãn là văn bản người viết, không phải dữ liệu có
# thể tính). Tập giá trị hợp lệ (vd. vung: I..IV) KHÔNG lặp lại ở đây — suy
# thẳng từ `bang_thang`/`gioi_han` ở trên bằng `rules.enum_facts()`, để một
# vùng mới thêm vào `bang_thang` không cần sửa hai chỗ. Dùng bởi
# GET /api/v1/mau/{loai} (Task 5) — sinh mô tả form KHÔNG hardcode trong
# Python; thêm/sửa nhãn là sửa YAML này.
facts_meta:
  thoi_gian_thu_viec_ngay:   {nhan: "Thời gian thử việc (ngày)", kieu: int}
  nhom_chuc_danh:            {nhan: "Nhóm chức danh", kieu: str}
  luong_thu_viec:            {nhan: "Lương thử việc (đồng/tháng)", kieu: int}
  luong_chinh_thuc:          {nhan: "Lương chính thức (đồng/tháng)", kieu: int}
  luong_thang:               {nhan: "Lương tháng (đồng/tháng)", kieu: int}
  vung:                      {nhan: "Vùng lương tối thiểu", kieu: str}
  co_dieu_khoan_phat_tien:   {nhan: "Có điều khoản phạt tiền người lao động", kieu: bool}
  co_dieu_khoan_giu_giay_to: {nhan: "Có điều khoản giữ giấy tờ tuỳ thân", kieu: bool}
  co_dieu_khoan_dat_coc:     {nhan: "Có điều khoản buộc đặt cọc", kieu: bool}
  lai_suat_nam_phan_tram:    {nhan: "Lãi suất vay (%/năm)", kieu: float}
  so_dai_dien_doi_thoai_nsdld: {nhan: "Số đại diện bên người sử dụng lao động tham gia đối thoại (người)", kieu: int}
  co_tran_nhiem_ky_05_nam:   {nhan: "Chức danh được bổ nhiệm là Giám đốc/Tổng giám đốc công ty cổ phần hoặc thành viên Hội đồng quản trị (có trần nhiệm kỳ 05 năm)", kieu: bool}
  nhiem_ky_thang:            {nhan: "Nhiệm kỳ bổ nhiệm (tháng)", kieu: int}
  muc_phat_thoa_thuan:              {nhan: "Mức phạt vi phạm thoả thuận trong hợp đồng (đồng)", kieu: int}
  gia_tri_phan_nghia_vu_bi_vi_pham: {nhan: "Giá trị phần nghĩa vụ hợp đồng bị vi phạm (đồng)", kieu: int}
  co_dieu_khoan_giai_quyet_tranh_chap: {nhan: "Có điều khoản chọn Trọng tài hoặc Toà án giải quyết tranh chấp", kieu: bool}
