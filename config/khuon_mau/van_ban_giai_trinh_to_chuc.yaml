# "Kính gửi:" lùi 4 cm, nội dung, "./.", Nơi nhận | người ký. Nội dung theo Luật XLVPHC
# Đ61 (biên bản làm căn cứ, ý kiến giải trình). Không có checklist riêng — cá nhân dùng
# `van_ban_giai_trinh`. Doanh nghiệp tư: tập quán.
