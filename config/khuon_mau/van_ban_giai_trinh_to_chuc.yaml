# Văn bản giải trình của tổ chức vi phạm hành chính — dựng TƯƠNG TỰ Mẫu 1.5 "Công văn",
# Nghị định 30/2020/NĐ-CP, Phụ lục III (Công báo 283+284, tr. 54). Không có mẫu văn bản
# giải trình của người vi phạm (NĐ 118/2021 chỉ có mẫu của người có thẩm quyền). Tổ
# chức gửi người có thẩm quyền xử phạt theo tập quán bằng công văn: đầu hai cột TÊN TỔ
