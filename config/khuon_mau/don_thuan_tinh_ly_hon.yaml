# Đơn yêu cầu công nhận thuận tình ly hôn, thỏa thuận nuôi con, chia tài sản khi ly
# hôn — trên Mẫu số 01-VDS (đơn yêu cầu giải quyết việc dân sự), Nghị quyết
# 04/2018/NQ-HĐTP. NQ 04/2018 KHÔNG có mẫu riêng cho thuận tình ly hôn: danh mục 33 mẫu
# chỉ có Mẫu 01-VDS (đơn chung, ô (1) ghi loại việc) và Mẫu 31-VDS (quyết định công nhận
# của Tòa) — D2 `tt/mau-that/index.md` §1. Người yêu cầu nộp trên Mẫu 01-VDS.
#
# Mẫu CHÍNH THỨC. Bố cục theo bản quét văn bản gốc (bản Word Bộ Tư pháp chuyển soạn
# không giữ bố cục — D2); chữ tĩnh chép nguyên văn bản quét, đối chiếu từng chữ với bản
# chuyển soạn .doc (`pdftotext -layout`, 2026-09-29). Chỉ bỏ dãy chấm (thành chỗ trống),
# chỉ số chú thích "(n)" và dòng chú thích phụ lục (Open decision 7). Áp đúng hướng dẫn
# của CHÍNH mẫu, không thêm gì ngoài đó:
#   (1)  V/v ghi loại việc theo BLTTDS — Đ29 khoản 2 "Yêu cầu công nhận thuận tình ly
#        hôn, thỏa thuận nuôi con, chia tài sản khi ly hôn".
#   (3)  nhiều người cùng làm đơn thì đánh số 1, 2 và ghi họ tên, ngày tháng năm sinh,
#        giấy tờ tùy thân của từng người: vợ và chồng CÙNG là người yêu cầu (BLTTDS
#        Đ396.2). Ghi "(chồng)"/"(vợ)" để hai khối không lẫn.
#   (12) nhiều người cùng yêu cầu thì cùng ký và ghi rõ họ tên — hai cột ký; cá nhân ký
#        tên hoặc điểm chỉ (BLTTDS Đ362.2 điểm g, Đ396.2).
# Nhãn đã ghi, kể cả chữ thêm theo hướng dẫn, ở `tests/test_services/du_lieu/nhan_mau_chinh_thuc.yaml`.
#
# Không checklist: điều luật của từng mục nằm ở `muc` bên dưới (thiết kế §7 "New
# types"). Mẫu 01-VDS không có khối căn cứ nên khung không in dòng căn cứ nào; căn cứ
# mở được theo từng mục (Luật HNGĐ Đ55, BLTTDS Đ362, Đ396).
