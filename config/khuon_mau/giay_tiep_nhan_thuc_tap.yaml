# Giấy tiếp nhận thực tập (thực hành) — dựng TƯƠNG TỰ Nghị định 30/2020/NĐ-CP, Phụ lục
# III, Mẫu 1.8 "Giấy giới thiệu" (Công báo 283+284, tr. 57): cùng họ "giấy" một cơ quan
# cấp về một người. Theo mẫu đó: bảng đầu trang tên cơ quan | quốc hiệu, "Số:" và
# địa danh-ngày cùng hàng, TÊN LOẠI, câu mở "<tên cơ quan> …:", các dòng thông tin
# người được tiếp nhận có dòng chấm, "Nơi nhận" trái | quyền hạn, chức vụ người ký phải.
# Không có trích yếu và "Kính gửi" (Phụ lục I chỉ dành "Kính gửi" cho công văn, tờ
# trình, báo cáo). Loại người dùng đã hỏi (quyết định 2026-09-29 mục 8). Ký hiệu "Số"
# để trống: Phụ lục III không có chữ viết tắt cho giấy tiếp nhận.
