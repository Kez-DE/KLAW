# Văn bản thỏa thuận phân chia tài sản chung khi ly hôn — KHÔNG có mẫu chính thức. Luật
# HNGĐ 52/2014/QH13 Đ59.1: "việc giải quyết tài sản do các bên thỏa thuận"; BLTTDS Đ396.3
# đòi tài liệu chứng minh thỏa thuận chia tài sản kèm đơn thuận tình ly hôn
# (`don_thuan_tinh_ly_hon`). KHÔNG phải chia tài sản chung TRONG thời kỳ hôn nhân (Đ38,
# Đ39 — thể chế khác, chưa có loại). Dựng TƯƠNG TỰ mẫu hợp đồng Nhà nước gần nhất,
# NĐ 96/2024 Phụ lục II (D2 §4.9): quốc hiệu và tiêu ngữ giữa trang; dòng địa danh-ngày nghiêng giữa trang
# TRÊN tên văn bản; tên văn bản in hoa đậm; căn cứ mỗi dòng một đoạn; "Hai bên chúng tôi
# gồm:" nghiêng; "I. BÊN …:" đậm với các dòng "- trường: …"; câu dẫn; "Điều n." đậm;
# khối ký hai cột ngay sau. Không dòng "Số": văn bản giữa hai vợ chồng, không phải hợp
# đồng của một tổ chức (Open decision 2).
#
# Không checklist: điều luật của từng điều nằm ở `muc` (thiết kế §7 "New types"). Căn cứ
# đã tra kho thật 2026-09-29: 52/2014/QH13 (id 36870) và 91/2015/QH13 (id 95942) đều được
# hiện, còn hiệu lực; mọi đường dẫn dưới đây có trong `provisions`.
