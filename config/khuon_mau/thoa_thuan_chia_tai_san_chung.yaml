# Điều khoản làm căn cứ cho CẢ văn bản (ngoài các điều của `muc`): Đ59.1 — tài sản khi
# ly hôn do các bên thỏa thuận.
can_cu: ["52/2014/QH13 > Điều 59 > Khoản 1"]
# Nội dung luật đòi: tài sản nào là tài sản chung được chia (Luật HNGĐ Đ33.1) và phần
# mỗi bên được nhận (BLDS Đ213.4: tài sản chung của vợ chồng phân chia theo thỏa thuận).
# Nghĩa vụ với người thứ ba: luật có quy tắc mặc định (Luật HNGĐ Đ60.1) nên không bắt
# buộc. Không có mục hiệu lực: Đ39.1 chỉ nói về chia TRONG thời kỳ hôn nhân, và chưa tra
# được điều luật riêng cho hiệu lực của thỏa thuận chia tài sản khi ly hôn.
