# Hợp đồng mua bán tài sản, dựng TƯƠNG TỰ Mẫu số Ia Phụ lục I Nghị định 96/2024/NĐ-CP
# (Công báo 937+938, tr. 38 và 61) — mẫu hợp đồng dân sự gần nhất do Chính phủ ban hành.
# Theo mẫu đó: quốc hiệu, tiêu ngữ ở giữa; dòng địa danh, ngày tháng ở giữa, TRÊN tên
# hợp đồng; "Số: ……/……" dưới tên; căn cứ; "Hai bên chúng tôi gồm:" nghiêng; "I. BÊN …
# (sau đây gọi tắt là Bên …):" đậm, các dòng "- …" thẳng lề chữ thân bài; câu dẫn; "Điều
# n." đậm; điều khoản cuối về số bản; khối ký hai cột. Khối ký theo chính Mẫu số Ia (hợp
# đồng mua bán): BÊN MUA trái, BÊN BÁN phải.
