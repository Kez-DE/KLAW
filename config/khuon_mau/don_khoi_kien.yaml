  - {ben: nguoi_khoi_kien}
  - {ben: nguoi_bi_kien}
  - {ben: nguoi_duoc_bao_ve}
  - {ben: nguoi_lien_quan}
  - {muc: yeu_cau, nhan: "Yêu cầu Tòa án giải quyết những vấn đề sau đây:", dam: true}
  - {ben: nguoi_lam_chung}
  - {muc: tai_lieu, nhan: "Danh mục tài liệu, chứng kèm theo đơn khởi kiện gồm có:", dam: true, danh_sach: 2}
