# Nội dung luật đòi (Luật HNGĐ): người trực tiếp nuôi con (Đ81.2); cấp dưỡng — bên không
# trực tiếp nuôi có nghĩa vụ (Đ82.2), mức do các bên thỏa thuận (Đ116.1), phương thức
# (Đ117); quyền, nghĩa vụ của MỖI bên đối với con (Đ81.2): thăm nom (Đ82.3) và không cản
# trở (Đ83.2). Thay đổi người trực tiếp nuôi (Đ84.2.a) là tùy chọn.
