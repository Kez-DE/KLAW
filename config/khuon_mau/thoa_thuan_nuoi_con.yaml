# Văn bản thỏa thuận về việc nuôi con sau khi ly hôn — KHÔNG có mẫu chính thức. Luật HNGĐ
# 52/2014/QH13 Đ81.2: "Vợ, chồng thỏa thuận về người trực tiếp nuôi con, nghĩa vụ, quyền
# của mỗi bên sau khi ly hôn đối với con"; BLTTDS Đ396.3 đòi tài liệu chứng minh thỏa
# thuận nuôi con kèm đơn thuận tình ly hôn (`don_thuan_tinh_ly_hon`). Bố cục TƯƠNG TỰ
# NĐ 96/2024 Phụ lục II, cùng khung với `thoa_thuan_chia_tai_san_chung`; thêm khối con
# chung (hai con — con thứ hai "nếu có").
#
# Không checklist: điều luật của từng điều nằm ở `muc`. Mọi đường dẫn đã tra kho thật
# 2026-09-29 (52/2014/QH13, id 36870, được hiện, còn hiệu lực).
