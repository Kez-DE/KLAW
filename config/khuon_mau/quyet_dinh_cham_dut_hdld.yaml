# Quyết định chấm dứt hợp đồng lao động — dựng TƯƠNG TỰ Mẫu 1.2 "Quyết định (cá biệt)
# quy định trực tiếp", Nghị định 30/2020/NĐ-CP, Phụ lục III (Công báo 283+284, tr. 49).
# Không có mẫu chính thức: BLLĐ 2019 Đ45.1 chỉ đòi thông báo bằng văn bản. Quyết định
# cá biệt của người sử dụng lao động nên lấy bố cục Mẫu 1.2 (đầu hai cột, tên loại +
# trích yếu, thẩm quyền, căn cứ, "QUYẾT ĐỊNH:", "Điều n." đậm đầu đoạn, "./.", Nơi
# nhận | người ký). Doanh nghiệp tư không thuộc NĐ 30 Đ2.1: đây là tập quán. Căn cứ
# của kho (Bộ luật Lao động) đi trước; hợp đồng lao động và người đề nghị là văn bản,
# người của chính doanh nghiệp — chỗ trống.
