  trang: 48
  ghi_chu: "Không có mẫu chính thức (BLLĐ Đ45.1 chỉ đòi văn bản). Bố cục theo Mẫu 1.2; với doanh nghiệp tư là tập quán, tham khảo Phụ lục I NĐ 30/2020."
