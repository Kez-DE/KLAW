# Hợp đồng thuê nhà ở — người hỏi xin đúng tên này (app thật 2026-09-30: "Soạn hợp đồng
# thuê nhà ở …" ra «HỢP ĐỒNG THUÊ TÀI SẢN» và "Chưa đặt được: «Hợp đồng thuê nhà ở»").
#
# Loại này KHÔNG phải một mẫu theo Luật Nhà ở số 27/2023/QH15: điều khoản là chế định THUÊ
# TÀI SẢN của BLDS (Đ472–482, Đ328, Đ398.2), đúng các mục của
# `checklist_hop_dong_thue_tai_san.yaml` (`test_dung_ban_thao_khuon_mau` khoá hai danh sách
# bằng nhau), còn tên văn bản là tên người hỏi xin. Luật Nhà ở có toàn văn trong kho từ N1
# (2026-09-30, `documents.id` 169032) nhưng chưa có mục nào theo nó. `luat_rieng`: văn bản
# chuyên ngành chi phối loại này mà điều khoản CHƯA theo — mỗi lượt tạo nói thẳng điều đó.
# ponytail: thêm mục theo Luật Nhà ở vào `muc` (plan `khuon-mau-thiet-ke.md` §7) rồi mới
# bỏ `luat_rieng`.
#
# Bố cục TƯƠNG TỰ NĐ 96/2024/NĐ-CP Phụ lục II, như `hop_dong_thue_tai_san`. Khối ký theo
# chính Phụ lục II (chủ dự án 2026-09-30: "Theo mẫu Nhà nước khi có"): BÊN THUÊ trái,
# BÊN CHO THUÊ phải — khác thứ tự các bên ở phần đầu (I. Bên cho thuê, II. Bên thuê).
