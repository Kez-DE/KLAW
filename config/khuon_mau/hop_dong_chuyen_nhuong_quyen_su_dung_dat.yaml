# Hợp đồng chuyển nhượng quyền sử dụng đất, dựng TƯƠNG TỰ Phụ lục II Nghị định
# 96/2024/NĐ-CP (Công báo 939+940, tr. 15–21) — mẫu hợp đồng dân sự gần nhất do Chính
# phủ ban hành. Theo mẫu đó: quốc hiệu, tiêu ngữ ở giữa; dòng địa danh, ngày tháng ở
# giữa, TRÊN tên hợp đồng; "Số: ……/……" dưới tên; căn cứ; "Hai bên chúng tôi gồm:"
# nghiêng; "I. BÊN … (sau đây gọi tắt là Bên …):" đậm, các dòng "- …" thẳng lề chữ thân
# bài; câu dẫn; "Điều n." đậm; điều khoản cuối về số bản; khối ký hai cột. Khối ký: Bên
# chuyển nhượng trái (mặc định của thiết kế §7). Hình thức BẮT BUỘC: công chứng hoặc
# chứng thực (Luật Đất đai 2024 Đ27.3.a), chuyển quyền có hiệu lực từ khi đăng ký (BLDS
# Đ503) — hai mục bắt buộc của checklist, nên câu kết không ghi ngày hiệu lực.
