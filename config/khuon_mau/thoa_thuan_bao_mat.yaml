  trang: 40
  ghi_chu: "Không có mẫu thoả thuận bảo mật do Nhà nước ban hành; bố cục theo mẫu HĐLĐ của Chính phủ gần nhất, nội dung bắt buộc theo TT 10/2020/TT-BLĐTBXH Đ4.2."
