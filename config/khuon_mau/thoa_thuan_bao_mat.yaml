ben:
  - khoa: nsdld
    tieu_de: "1. BÊN A: NGƯỜI SỬ DỤNG LAO ĐỘNG"
    truong: [ten_to_chuc, dia_chi_tru_so, ma_so_doanh_nghiep, nguoi_dai_dien, chuc_vu, dien_thoai]
    nhan:
      ten_to_chuc: "Tên người sử dụng lao động"
      dia_chi_tru_so: "Địa chỉ"
      ma_so_doanh_nghiep: "Mã số doanh nghiệp"
      nguoi_dai_dien: "Họ tên người giao kết"
      chuc_vu: "Chức danh"
      dien_thoai: "Điện thoại"
  - khoa: nld
