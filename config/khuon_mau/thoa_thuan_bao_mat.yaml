# Thoả thuận bảo vệ bí mật kinh doanh, bí mật công nghệ — dựng TƯƠNG TỰ Mẫu số 01/PLV,
# Nghị định 145/2020/NĐ-CP (Công báo 1205+1206, tr. 41–44), cùng khuôn với `hdld.yaml`:
# quốc hiệu và tiêu ngữ ở giữa, không Số, không dòng ngày (Open decision 2), căn cứ
# nghiêng, "1. BÊN A: …" / "2. BÊN B: …" đậm với mỗi dòng một trường, câu dẫn nghiêng,
# "Điều n." đậm, khối ký hai cột NGƯỜI LAO ĐỘNG (BÊN B) trái, NGƯỜI SỬ DỤNG LAO ĐỘNG
# (BÊN A) phải. Nhãn trường theo BLLĐ Đ21.1 điểm a, b. Thoả thuận giữa người lao động và
# người sử dụng lao động (BLLĐ Đ21.2, TT 10/2020 Đ4).
loai: thoa_thuan_bao_mat
ten: thoả thuận bảo vệ bí mật kinh doanh, bí mật công nghệ
tieu_de: THOẢ THUẬN BẢO VỆ BÍ MẬT KINH DOANH, BÍ MẬT CÔNG NGHỆ
