# Hợp đồng dịch vụ bất động sản, dựng TƯƠNG TỰ Phụ lục II Nghị định 96/2024/NĐ-CP (Công
# báo 939+940, tr. 15–21) — mẫu hợp đồng dân sự gần nhất do Chính phủ ban hành. Theo mẫu
# đó: quốc hiệu, tiêu ngữ ở giữa; dòng địa danh, ngày tháng ở giữa, TRÊN tên hợp đồng;
# "Số: ……/……" dưới tên; căn cứ; "Hai bên chúng tôi gồm:" nghiêng; "I. BÊN … (sau đây gọi
# tắt là Bên …):" đậm, các dòng "- …" thẳng lề chữ thân bài; câu dẫn; "Điều n." đậm;
# điều khoản cuối về số bản; khối ký hai cột. Khối ký: Bên sử dụng dịch vụ trái (mặc
# định của thiết kế §7). Mục `cac_ben` (Luật KDBĐS Đ46.4.a) do khối các bên đáp ứng; mục
# `hieu_luc` (Đ46.4.i) là một Điều, nên câu kết không ghi ngày hiệu lực.
loai: hop_dong_dich_vu_bat_dong_san
ten: hợp đồng dịch vụ bất động sản
tieu_de: HỢP ĐỒNG DỊCH VỤ BẤT ĐỘNG SẢN
bo_cuc: hop_dong
nguon:
  loai: tuong_tu
  van_ban: "Nghị định 96/2024/NĐ-CP, Phụ lục II Hợp đồng thuê nhà ở (tham chiếu bố cục)"
  url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2024/7/42491/51289-1-2024939-94096-2024-nd-cp.pdf
  tep_d2: goc/nd96-2024_congbao-939-940.pdf
  sha256: 5b41a37fec6af317480a600f70cb4233ae852d6b297613ebe32222f531322174
  trang: 14
  ghi_chu: "Không có mẫu hợp đồng dịch vụ bất động sản (NĐ 96/2024 Phụ lục I–XI không có mẫu dịch vụ) do Nhà nước ban hành; bố cục theo mẫu hợp đồng dân sự của Chính phủ gần nhất (NĐ 96/2024 Phụ lục II), nội dung bắt buộc theo checklist. Thể thức theo tập quán — NĐ 30/2020 không bắt buộc hợp đồng dân sự."
the_thuc:
  dong_mau: null
  co_quan: false
  so: "Số: {}/{}"
  ngay: dau
  kinh_gui: null
  can_cu: true
  noi_nhan: null
  thut_ben_mm: 12.7
  ket_thuc: "Hợp đồng này được lập thành {} bản có giá trị pháp lý như nhau, mỗi bên giữ {} bản."
ben:
  - khoa: ben_su_dung
    vai: Bên sử dụng dịch vụ
    tieu_de: "I. BÊN SỬ DỤNG DỊCH VỤ (sau đây gọi tắt là Bên sử dụng dịch vụ):"
    dong:
      - "- Họ và tên:{ho_ten}"
      - "- Ngày sinh:{ngay_sinh}"
      - "- Số định danh cá nhân:{so_dinh_danh}"
      - "- Nơi cư trú:{noi_cu_tru}"
      - "- Số điện thoại:{dien_thoai}"
  - khoa: ben_cung_cap
    vai: Bên cung cấp dịch vụ
    tieu_de: "II. BÊN CUNG CẤP DỊCH VỤ (sau đây gọi tắt là Bên cung cấp dịch vụ):"
    dong:
      - "- Tên tổ chức:{ten_to_chuc}"
      - "- Mã số doanh nghiệp:{ma_so_doanh_nghiep}"
      - "- Địa chỉ trụ sở:{dia_chi_tru_so}"
      - "- Người đại diện theo pháp luật:{nguoi_dai_dien}"
      - "- Chức vụ:{chuc_vu}"
      - "- Số điện thoại:{dien_thoai}"
      - "- Số tài khoản:{so_tai_khoan}"
      - "- Tại ngân hàng:{ngan_hang}"
than:
  - {dong: "Hai bên chúng tôi gồm:", nghieng: true}
  - {ben: ben_su_dung}
  - {ben: ben_cung_cap}
  - {dong: "Hai bên chúng tôi thống nhất ký kết hợp đồng dịch vụ bất động sản với các nội dung sau đây:"}
  - {dieu: dieu}
muc_khung: [cac_ben]
ky:
  thu_tu: [ben_su_dung, ben_cung_cap]
  o:
    - {khoa: ben_su_dung, vai: "BÊN SỬ DỤNG DỊCH VỤ", ghi_chu: "(Ký, ghi rõ họ tên)", ho_ten_tu: ho_ten}
    - {khoa: ben_cung_cap, vai: "ĐẠI DIỆN\nBÊN CUNG CẤP DỊCH VỤ", ghi_chu: "(Ký, ghi rõ họ tên, chức vụ\nvà đóng dấu)", ho_ten_tu: nguoi_dai_dien}
