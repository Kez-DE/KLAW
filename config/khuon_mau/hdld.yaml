# Hợp đồng lao động — dựng TƯƠNG TỰ Mẫu số 01/PLV, Nghị định 145/2020/NĐ-CP (Công báo
# 1205+1206, tr. 41–44; hợp đồng lao động giúp việc gia đình, mẫu HĐLĐ duy nhất do
# Chính phủ ban hành cho bên tư). Theo mẫu đó: quốc hiệu và tiêu ngữ ở giữa, không Số,
# không dòng ngày (Open decision 2), căn cứ nghiêng, "1. BÊN A: …" / "2. BÊN B: …" in
# đậm với mỗi dòng một trường, câu dẫn nghiêng, "Điều n." đậm, khối ký hai cột NGƯỜI
# LAO ĐỘNG (BÊN B) trái, NGƯỜI SỬ DỤNG LAO ĐỘNG (BÊN A) phải. Nhãn trường theo BLLĐ
# 2019 Đ21.1 điểm a, b. Câu kết theo BLLĐ Đ14.1 ("được làm thành 02 bản, người lao
# động giữ 01 bản, người sử dụng lao động giữ 01 bản").
