# Quy chế dân chủ ở cơ sở tại nơi làm việc — dựng TƯƠNG TỰ Nghị định 30/2020/NĐ-CP,
# Phụ lục III: Mẫu 1.3 "Quyết định (quy định gián tiếp)" ban hành, cộng "Mẫu văn bản …
# kèm theo quyết định" (Công báo 283+284, tr. 50–51). Không có mẫu chính thức: NĐ
# 145/2020 (Phụ lục I, III, IV, V) không có mẫu quy chế dân chủ. "Quy chế" có tên
# trong NĐ 30 Đ7 và thường ban hành kèm quyết định, nên một tệp hai phần như
# `quy_che_noi_bo`: quyết định ban hành (căn cứ của kho: NĐ 145/2020), rồi QUY CHẾ kèm
# theo với các Điều theo mục NĐ 145 Đ37.2, Đ43.2, Đ44.2, Đ47.3. Doanh nghiệp tư: tập
# quán.
