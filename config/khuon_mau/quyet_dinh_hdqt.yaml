# Nghị quyết của Hội đồng quản trị — dựng TƯƠNG TỰ Mẫu 1.1 "Nghị quyết (cá biệt)",
# Nghị định 30/2020/NĐ-CP, Phụ lục III (Công báo 283+284, tr. 48). Không có mẫu chính
# thức cho nghị quyết HĐQT (TT 68/2025/TT-BTC không có); Mẫu 1.1 là mẫu gần nhất, chỉ
# bắt buộc khi công ty là doanh nghiệp nhà nước. Tập thể ban hành nên ký "TM." trước
# tên tập thể (Phụ lục I, II.7.b); chức vụ Chủ tịch là tập quán — Luật Doanh nghiệp
# 2020 chưa kiểm về người ký (mau-hien-co.md). Điều lệ và biên bản cuộc họp là văn bản
# của chính công ty: dòng căn cứ có chỗ trống.
