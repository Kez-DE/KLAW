# Hợp đồng thử việc — dựng TƯƠNG TỰ Mẫu số 01/PLV, Nghị định 145/2020/NĐ-CP (Công báo
# 1205+1206, tr. 41–44), cùng khuôn với `hdld.yaml`: quốc hiệu và tiêu ngữ ở giữa, không
# Số, không dòng ngày (Open decision 2), căn cứ nghiêng, "1. BÊN A: …" / "2. BÊN B: …"
# đậm với mỗi dòng một trường, câu dẫn nghiêng, "Điều n." đậm, khối ký hai cột NGƯỜI LAO
# ĐỘNG (BÊN B) trái, NGƯỜI SỬ DỤNG LAO ĐỘNG (BÊN A) phải. Nhãn trường theo BLLĐ Đ21.1
# điểm a, b. Đ24.2 dẫn các điểm a, b của Đ21.1 nên hai khối các bên chính là hai mục
# `nsdld`, `nld` của checklist. Câu kết để trống số bản: Đ14.1 (02 bản) nói về HỢP ĐỒNG
