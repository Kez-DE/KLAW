# Đơn đăng ký đi thực tập — dựng TƯƠNG TỰ Mẫu số 01, Nghị định 124/2020/NĐ-CP (đơn của
# một cá nhân gửi một tổ chức): quốc hiệu và tiêu ngữ giữa, dòng ngày, TÊN ĐƠN, "Kính
# gửi:", thông tin người làm đơn, cơ sở và thời gian thực tập, cam kết; khối ký hai cột
# xác nhận của khoa (trái) | người làm đơn (phải). Không có mẫu quốc gia: mỗi cơ sở đào
# tạo tự ban hành. Loại người dùng đã hỏi (quyết định 2026-09-29 mục 8).
