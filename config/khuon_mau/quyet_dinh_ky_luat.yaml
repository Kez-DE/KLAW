# Quyết định xử lý kỷ luật lao động — dựng TƯƠNG TỰ Mẫu 1.2 "Quyết định (cá biệt) quy
# định trực tiếp", Nghị định 30/2020/NĐ-CP, Phụ lục III (Công báo 283+284, tr. 49).
# Không có mẫu chính thức: NĐ 145/2020 Đ70 quy định trình tự, Phụ lục IV không có mẫu
# quyết định kỷ luật. Căn cứ của kho (Bộ luật Lao động, NĐ 145/2020) đi trước; nội quy
# lao động và biên bản cuộc họp xử lý kỷ luật (BLLĐ Đ122.1.d) là văn bản của chính
# doanh nghiệp — dòng căn cứ có chỗ trống. Thẩm quyền ban hành (NĐ 145 Đ70.4) là dòng
# "THẨM QUYỀN BAN HÀNH" và khối ký. Doanh nghiệp tư không thuộc NĐ 30 Đ2.1: tập quán.
