# Danh mục trường của khuôn mẫu (thiết kế `khuon-mau-thiet-ke.md` §7): khoá → nhãn.
# Mỗi khoá là một chỗ trống bộ dựng biết tên, để giá trị người dùng nói ("họ tên bên
# B là …") thành đúng một phép `dien`. Một dòng mẫu chỉ được gọi khoá có ở đây —
