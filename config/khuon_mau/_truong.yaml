# Trường của cả văn bản (`van_ban`) mà trang in nhiều lần: quyết định ban hành và dòng
# "(Kèm theo Quyết định số … ngày … tháng … năm … của …)" của văn bản kèm theo, trích yếu
# chưa có. Một giá trị điền mọi bản sao — lời trong chat (`ban_thao.phep_tu_gia_tri`) và
# điền trên trang (`ban_thao.phep_o_dien`). Một ngày đủ cho `ngay_ban_hanh` tách ra ba
# chỗ ngày, tháng, năm (`hieu_tai_lieu._tach_ngay`).
