# Đơn xin tạm hoãn nghĩa vụ quân sự (đúng tên pháp lý: đề nghị tạm hoãn gọi nhập ngũ,
# Luật Nghĩa vụ quân sự 78/2015/QH13 Điều 41) — dựng TƯƠNG TỰ Mẫu số 01, Nghị định
# 124/2020/NĐ-CP (đơn của một cá nhân gửi cơ quan có thẩm quyền).
#
# KHÔNG có mẫu đơn chính thức (đã đọc 2026-09-29, nguồn Công báo):
# - Thông tư 148/2018/TT-BQP (Công báo 1005+1006, 8 trang, bản quét, OCR tesseract-vie):
#   Điều 5 kê các diện tạm hoãn gọi nhập ngũ "theo quy định tại Điều 41 Luật nghĩa vụ
#   quân sự năm 2015"; không có phụ lục mẫu nào. Tệp:
#   congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2018/10/27453/24083-1-20181005-1006148-2018-tt-bqp.pdf
#   (SHA-256 ed7b72bf7aa5a5029d795efc31d548f7248e8c61191c26fa752d5088ef24e768). Thông tư
#   68/2025/TT-BQP sửa đổi Thông tư này; chưa đọc nội dung (bản quét).
# - Nghị định 13/2016/NĐ-CP Điều 3 khoản 2 giao Bộ trưởng Bộ Quốc phòng "hệ thống mẫu
#   biểu đăng ký nghĩa vụ quân sự" và kê đủ các mẫu (lệnh gọi, phiếu tự khai sức khỏe,
#   giấy chứng nhận, giấy giới thiệu di chuyển, sổ đăng ký): không có đơn đề nghị tạm hoãn.
#   Tệp: congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2016/2/19138/13631-1-132016nd-cp13681pdf
#   (SHA-256 a75077e5aaa147ed6af725676c1d11c6243ea6732303835567289dc1d3b6e730).
# Luật NVQS (và luật sửa đổi 98/2025/QH15) CHƯA có trong kho, nên khung không in dòng
# căn cứ nào và mô hình không được dẫn số điều (lưới chặn của §6). "Kính gửi" để trống:
