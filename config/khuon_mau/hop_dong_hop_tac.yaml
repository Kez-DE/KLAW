# Hợp đồng hợp tác kinh doanh, dựng TƯƠNG TỰ Phụ lục II Nghị định 96/2024/NĐ-CP (Công
# báo 939+940, tr. 15–21) — mẫu hợp đồng dân sự gần nhất do Chính phủ ban hành. Theo mẫu
# đó: quốc hiệu, tiêu ngữ ở giữa; dòng địa danh, ngày tháng ở giữa, TRÊN tên hợp đồng;
# "Số: ……/……" dưới tên; căn cứ; "Hai bên chúng tôi gồm:" nghiêng; "I. BÊN … (sau đây gọi
# tắt là Bên …):" đậm, các dòng "- …" thẳng lề chữ thân bài; câu dẫn; "Điều n." đậm;
# điều khoản cuối về số bản; khối ký hai cột. Khối ký: Bên A trái (mặc định của thiết kế
# §7). Mục `cac_ben` của checklist (BLDS Đ505.2) do chính khối các bên đáp ứng
# (`muc_khung`).
loai: hop_dong_hop_tac
ten: hợp đồng hợp tác kinh doanh
tieu_de: HỢP ĐỒNG HỢP TÁC KINH DOANH
bo_cuc: hop_dong
nguon:
  loai: tuong_tu
  van_ban: "Nghị định 96/2024/NĐ-CP, Phụ lục II Hợp đồng thuê nhà ở (tham chiếu bố cục)"
  url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2024/7/42491/51289-1-2024939-94096-2024-nd-cp.pdf
  tep_d2: goc/nd96-2024_congbao-939-940.pdf
  sha256: 5b41a37fec6af317480a600f70cb4233ae852d6b297613ebe32222f531322174
  trang: 14
  ghi_chu: "Không có mẫu hợp đồng hợp tác kinh doanh do Nhà nước ban hành; bố cục theo mẫu hợp đồng dân sự của Chính phủ gần nhất (NĐ 96/2024 Phụ lục II), nội dung bắt buộc theo checklist. Thể thức theo tập quán — NĐ 30/2020 không bắt buộc hợp đồng dân sự."
the_thuc:
  dong_mau: null
  co_quan: false
  so: "Số: {}/{}"
  ngay: dau
  kinh_gui: null
  can_cu: true
  noi_nhan: null
  thut_ben_mm: 12.7
  ket_thuc: "Hợp đồng này có hiệu lực kể từ ngày {} tháng {} năm {}; được lập thành {} bản có giá trị pháp lý như nhau, mỗi bên giữ {} bản."
ben:
  - khoa: ben_a
    vai: Bên A
    tieu_de: "I. BÊN A:"
    dong:
      - "- Tên tổ chức:{ten_to_chuc}"
      - "- Mã số doanh nghiệp:{ma_so_doanh_nghiep}"
      - "- Địa chỉ trụ sở:{dia_chi_tru_so}"
      - "- Người đại diện theo pháp luật:{nguoi_dai_dien}"
      - "- Chức vụ:{chuc_vu}"
      - "- Số điện thoại:{dien_thoai}"
      - "- Số tài khoản:{so_tai_khoan}"
      - "- Tại ngân hàng:{ngan_hang}"
  - khoa: ben_b
    vai: Bên B
    tieu_de: "II. BÊN B:"
    dong:
      - "- Tên tổ chức:{ten_to_chuc}"
      - "- Mã số doanh nghiệp:{ma_so_doanh_nghiep}"
      - "- Địa chỉ trụ sở:{dia_chi_tru_so}"
      - "- Người đại diện theo pháp luật:{nguoi_dai_dien}"
      - "- Chức vụ:{chuc_vu}"
      - "- Số điện thoại:{dien_thoai}"
      - "- Số tài khoản:{so_tai_khoan}"
      - "- Tại ngân hàng:{ngan_hang}"
than:
  - {dong: "Hai bên chúng tôi gồm:", nghieng: true}
  - {ben: ben_a}
  - {ben: ben_b}
  - {dong: "Hai bên chúng tôi thống nhất ký kết hợp đồng hợp tác kinh doanh với các nội dung sau đây:"}
  - {dieu: dieu}
muc_khung: [cac_ben]
ky:
  thu_tu: [ben_a, ben_b]
  o:
    - {khoa: ben_a, vai: "ĐẠI DIỆN BÊN A", ghi_chu: "(Ký, ghi rõ họ tên, chức vụ\nvà đóng dấu)", ho_ten_tu: nguoi_dai_dien}
    - {khoa: ben_b, vai: "ĐẠI DIỆN BÊN B", ghi_chu: "(Ký, ghi rõ họ tên, chức vụ\nvà đóng dấu)", ho_ten_tu: nguoi_dai_dien}
truong_tu_facts: {}
