# Nội quy lao động — dựng TƯƠNG TỰ Nghị định 30/2020/NĐ-CP, Phụ lục III: Mẫu 1.3
# "Quyết định (quy định gián tiếp)" ban hành, cộng "Mẫu văn bản … kèm theo quyết định"
# (Công báo 283+284, tr. 50–51). Không có mẫu chính thức: NĐ 145/2020 không có mẫu nội
# quy, NĐ 30 Đ7 không gọi tên "nội quy". Người sử dụng lao động ban hành nội quy bằng
# quyết định (BLLĐ 2019 Đ118.1 đòi văn bản khi dùng từ 10 người lao động), nên một tệp
# hai phần như `quy_che_noi_bo`: quyết định ban hành (căn cứ của kho: BLLĐ, NĐ 145), rồi
# NỘI QUY LAO ĐỘNG kèm theo với các Điều theo mục BLLĐ Đ118.2. Phụ lục III không có
# chữ viết tắt cho nội quy: ký hiệu quyết định là QĐ. Doanh nghiệp tư: tập quán.
