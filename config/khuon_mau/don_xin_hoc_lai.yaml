# Đơn xin học lại — dựng TƯƠNG TỰ Mẫu số 01, Nghị định 124/2020/NĐ-CP (đơn của một cá
# nhân gửi một tổ chức). Loại người dùng đã hỏi (quyết định 2026-09-29 mục 8). Không
# tìm thấy mẫu ban hành kèm văn bản quy phạm pháp luật: đơn gửi cơ sở đào tạo theo quy
# chế đào tạo của chính cơ sở ấy, nên khung không in căn cứ. Hai trường hợp thường gặp
# — học lại một học phần, hay trở lại học sau thời gian tạm dừng — đều viết ở "Nội dung
# đề nghị".
