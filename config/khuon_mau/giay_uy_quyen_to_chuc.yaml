      - "Mã số doanh nghiệp:{ma_so_doanh_nghiep}"
      - "Người đại diện theo pháp luật:{nguoi_dai_dien}"
      - "Chức vụ:{chuc_vu}"
  - khoa: ben_duoc_uy_quyen
    vai: "Bên được ủy quyền"
