  tep_d2: goc/nd30-2020_congbao-283-284.pdf
  sha256: 698e45e0aae921a20c0e31ffa87c50fd0324f640e70a6eca8d49e4f51045c7bb
  trang: 52
  ghi_chu: "Trang PDF 52 = Công báo tr. 53. Mẫu 1.4 áp cho giấy ủy quyền của cơ quan, tổ chức (ghi chú 6); nội dung theo BLDS 2015 Đ138–Đ141; doanh nghiệp tư theo tập quán."
