# Giấy ủy quyền của tổ chức — dựng TƯƠNG TỰ Mẫu 1.4 "Văn bản có tên loại", Nghị định
# 30/2020/NĐ-CP, Phụ lục III (Công báo 283+284, tr. 53): ghi chú 6 của mẫu kể giấy ủy
# quyền trong các loại dùng mẫu này; ký hiệu GUQ theo Phụ lục III Mục I. Không có mẫu
# giấy ủy quyền chung; nội dung theo BLDS 2015 Đ138 (hai bên), Đ141 (phạm vi), Đ140
# (thời hạn). Theo mẫu: đầu hai cột TÊN CƠ QUAN | quốc hiệu, "Số: …/GUQ-…" | địa danh-
# ngày; tên loại giữa, kẻ ngắn; nội dung; "./."; Nơi nhận | người ký. Tổ chức ủy quyền
# là cơ quan ban hành (cùng trường tên với đầu trang); người ký là người đại diện theo
# pháp luật (cùng trường chức vụ, họ tên). Không có checklist riêng — cá nhân ủy quyền
# dùng `giay_uy_quyen`. Doanh nghiệp tư: tập quán.
loai: giay_uy_quyen_to_chuc
ten: giấy ủy quyền của tổ chức
tieu_de: GIẤY ỦY QUYỀN
