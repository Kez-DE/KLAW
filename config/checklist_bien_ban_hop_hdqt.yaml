# Checklist nội dung của BIÊN BẢN HỌP HỘI ĐỒNG QUẢN TRỊ — Luật Doanh nghiệp
# Đ158.1 a-i, chín điểm, mỗi mục một điểm luật riêng.
#
# CỐ Ý hẹp vào biên bản họp HĐQT của công ty cổ phần, không phải "biên bản họp"
# nói chung: Luật Doanh nghiệp quy định BA danh mục nội dung khác nhau cho ba
# loại cuộc họp — Đ158.1 (HĐQT), Đ150.1 (Đại hội đồng cổ đông), Đ60 (Hội đồng
# thành viên công ty TNHH). Gộp chúng thành một mẫu chung sẽ soát một biên bản
# ĐHĐCĐ bằng danh mục của HĐQT và báo thiếu những nội dung luật không đòi ở đó.
# Hai loại kia dựng được bằng đúng khuôn này khi cần, mỗi loại một file.
#
# Mọi can_cu đã tự tra DB thật (không chép từ trí nhớ):
#   SELECT duong_dan, noi_dung FROM provisions
#    WHERE duong_dan LIKE '59/2020/QH14 > Điều 158%';
loai: bien_ban_hop_hdqt
ten: "biên bản họp Hội đồng quản trị"
tieu_de: "BIÊN BẢN HỌP HỘI ĐỒNG QUẢN TRỊ"
don_vi_muc: "Mục"

# KHÔNG rule nào. Điều kiện tiến hành họp (Đ157.8: ít nhất ba phần tư tổng số
# thành viên dự họp) và tỷ lệ thông qua (Đ157.12: đa số thành viên dự họp tán
# thành) VỀ NGUYÊN TẮC là hai rule số học đúng khuôn `kiem:` — nhưng cả hai cần
# tổng số thành viên HĐQT và số thành viên dự họp làm fact, và biên bản là văn
# bản khai hai con số đó. Kiểm chúng bằng chính con số người dùng gõ vào là
# kiểm một lời khai bằng chính nó. Chưa dựng ở đây, không phải quên.
rules: []

