# Checklist nội dung của HỢP ĐỒNG MUA BÁN HÀNG HOÁ giữa thương nhân — Luật
# Thương mại Đ24-62, khung chung của hợp đồng mua bán ở BLDS Đ430-433.
#
# Hai văn bản chứ không một: LTM Đ4.3 dẫn chiếu Bộ luật Dân sự cho những gì LTM
# không quy định, nên mục "đối tượng" và "giá, phương thức thanh toán" dẫn BLDS
# (Đ431, Đ433) còn giao hàng, thời hạn thanh toán, bảo hành, chuyển rủi ro dẫn
# LTM — mỗi mục dẫn đúng văn bản đang điều chỉnh nó.
#
# muc_do_thieu: canh_bao — không văn bản nào liệt kê nội dung bắt buộc của hợp
# đồng mua bán hàng hoá; sáu mục bắt buộc dưới đây là những nội dung có điều
# luật riêng điều chỉnh.
#
# Mọi can_cu đã tự tra DB thật (không chép từ trí nhớ):
#   SELECT duong_dan, tieu_de FROM provisions
#    WHERE duong_dan ~ '^36/2005/QH11 > Điều (24|34|35|37|44|49|55|57|62)$'
#       OR duong_dan ~ '^91/2015/QH13 > Điều 43[013]$';
loai: hop_dong_mua_ban
ten: "hợp đồng mua bán hàng hoá"
tieu_de: "HỢP ĐỒNG MUA BÁN HÀNG HOÁ"
muc_do_thieu: canh_bao

# Dựng trên chế định HỢP ĐỒNG (BLDS Đ385 "sự thoả thuận giữa các bên"), nên
# `GET /mau/{loai}` kèm thêm khối các bên + chỗ ký (`cau_truc.khung_hop_dong`).
# Hai khối đó KHÔNG phải `muc` và KHÔNG vào mẫu số completeness.
la_hop_dong: true

# Hai rule dùng chung của config/rules.yaml, khai RIÊNG ở đây — không khai ở
# checklist_hop_dong_dich_vu.yaml hay bất kỳ mẫu nào khác:
#   tran_phat_vi_pham_hop_dong (Đ301) chừa lối trừ Đ266 cho hợp đồng DỊCH VỤ
#   GIÁM ĐỊNH (mức phạt khác, không phải 8%) — khai rule này ở checklist dịch
#   vụ chung sẽ áp nhầm trần 8% lên đúng loại hợp đồng luật miễn trừ.
#   thieu_dieu_khoan_giai_quyet_tranh_chap (Đ317.3) là cảnh báo chung cho hợp
#   đồng thương mại, không riêng gì mua bán hàng hoá, nhưng khai ở đây trước vì
#   đây là mẫu hợp đồng thương mại đầu tiên có checklist đủ chi tiết — cùng lối
#   `lai_suat_vay_toi_da` chỉ khai ở một checklist dù luật áp dụng rộng hơn.
rules: [tran_phat_vi_pham_hop_dong, thieu_dieu_khoan_giai_quyet_tranh_chap]

can_cu_goc: "91/2015/QH13 > Điều 430"
can_cu_chi_tiet: "36/2005/QH11 > Điều 24"

# Bốn mục điều kiện. Đ44 mở đầu "Trường hợp các bên có thoả thuận để bên mua…
# kiểm tra hàng hoá trước khi giao hàng"; Đ49 mở đầu "Trường hợp hàng hoá mua
# bán có bảo hành"; Đ57 và Đ62 là quy tắc MẶC ĐỊNH áp dụng khi các bên không
# thoả thuận khác, nên hợp đồng im lặng vẫn có đủ quy tắc điều chỉnh — im lặng
# ở đó không phải khuyết thiếu.
#
# 2026-09-29 (quyết định 2026-09-29 mục 3, nghiên cứu `hop-dong.md` §3): thêm mục tuỳ
# chọn trách nhiệm do vi phạm hợp đồng (BLDS Đ398.2.e, danh mục "có thể có") — rule
# `tran_phat_vi_pham_hop_dong` kiểm MỨC phạt, còn đây là MỤC điều khoản.
# Đã tự tra DB:
#   SELECT duong_dan FROM provisions WHERE duong_dan ~ '^91/2015/QH13 > Điều 398';
khong_bat_buoc:
  can_cu: "36/2005/QH11 > Điều 24"
  ghi_chu: >
    Kiểm tra hàng hoá (Đ44) và bảo hành (Đ49) chỉ đặt ra khi các bên có thoả
    thuận; chuyển rủi ro (Đ57) và chuyển quyền sở hữu (Đ62) là quy tắc mặc định
    của luật. Trách nhiệm do vi phạm nằm trong danh mục "có thể có" của BLDS Đ398.2
    (điểm e). Vắng mặt không được báo là thiếu.
  keys: [kiem_tra_hang, bao_hanh, chuyen_rui_ro, quyen_so_huu, trach_nhiem_vi_pham]

muc:
  - {stt: 1, key: hang_hoa, ten: "Tên hàng, chủng loại, số lượng, chất lượng hàng hoá", can_cu: "91/2015/QH13 > Điều 431", tu_khoa: ["hàng hoá", "hàng hóa", "tên hàng hoá", "tên hàng hóa", "đối tượng của hợp đồng", "chủng loại hàng hoá", "số lượng, chất lượng"]}
  - {stt: 2, key: gia_va_thanh_toan, ten: "Giá và phương thức thanh toán", can_cu: "91/2015/QH13 > Điều 433", tu_khoa: ["giá và phương thức thanh toán", "đơn giá", "giá hàng hoá", "tổng giá trị hợp đồng", "phương thức thanh toán"]}
  - {stt: 3, key: thoi_han_thanh_toan, ten: "Thời hạn thanh toán", can_cu: "36/2005/QH11 > Điều 55", tu_khoa: ["thời hạn thanh toán"]}
  - {stt: 4, key: giao_hang, ten: "Giao hàng và chứng từ liên quan đến hàng hoá", can_cu: "36/2005/QH11 > Điều 34", tu_khoa: ["giao hàng và chứng từ", "chứng từ liên quan", "giao nhận hàng hoá", "giao hàng"]}
  - {stt: 5, key: dia_diem_giao_hang, ten: "Địa điểm giao hàng", can_cu: "36/2005/QH11 > Điều 35", tu_khoa: ["địa điểm giao hàng"]}
  - {stt: 6, key: thoi_han_giao_hang, ten: "Thời hạn giao hàng", can_cu: "36/2005/QH11 > Điều 37", tu_khoa: ["thời hạn giao hàng", "thời gian giao hàng"]}
  - {stt: 7, key: kiem_tra_hang, ten: "Kiểm tra hàng hoá trước khi giao hàng (nếu có thoả thuận)", can_cu: "36/2005/QH11 > Điều 44", tu_khoa: ["kiểm tra hàng hoá", "kiểm tra hàng hóa", "nghiệm thu hàng hoá"]}
  - {stt: 8, key: bao_hanh, ten: "Bảo hành hàng hoá (nếu hàng hoá có bảo hành)", can_cu: "36/2005/QH11 > Điều 49", tu_khoa: ["bảo hành hàng hoá", "bảo hành hàng hóa", "bảo hành"]}
  - {stt: 9, key: chuyen_rui_ro, ten: "Chuyển rủi ro đối với hàng hoá", can_cu: "36/2005/QH11 > Điều 57", tu_khoa: ["chuyển rủi ro", "rủi ro đối với hàng hoá"]}
  - {stt: 10, key: quyen_so_huu, ten: "Thời điểm chuyển quyền sở hữu hàng hoá", can_cu: "36/2005/QH11 > Điều 62", tu_khoa: ["chuyển quyền sở hữu", "thời điểm chuyển quyền sở hữu"]}
  - {stt: 11, key: trach_nhiem_vi_pham, ten: "Trách nhiệm do vi phạm hợp đồng", can_cu: "91/2015/QH13 > Điều 398 > Khoản 2 > Điểm e", tu_khoa: ["trách nhiệm do vi phạm", "phạt vi phạm", "bồi thường thiệt hại"]}
