# Checklist nội dung của HỢP ĐỒNG TẶNG CHO TÀI SẢN — BLDS Đ457–462 (quyết định
# 2026-09-29 mục 3, nghiên cứu `hop-dong.md` §2.3).
#
# PHẠM VI: mẫu chung cho động sản và bất động sản không phải nhà ở. Tặng cho QUYỀN SỬ
# DỤNG ĐẤT có mẫu riêng (`hop_dong_tang_cho_quyen_su_dung_dat`, Luật Đất đai Đ27.3.a);
# tặng cho NHÀ Ở còn chịu Luật Nhà ở 27/2023 — mẫu chưa đối chiếu với văn bản đó.
#
# muc_do_thieu: canh_bao — BLDS không liệt kê nội dung bắt buộc.
#
# Hình thức: tặng cho bất động sản phải lập văn bản có công chứng, chứng thực hoặc
# phải đăng ký (Đ459.1) và có hiệu lực từ thời điểm đăng ký (Đ459.2); tặng cho động
# sản có hiệu lực khi bên được tặng cho nhận tài sản, động sản phải đăng ký thì từ lúc
# đăng ký (Đ458). Mục `bat_dong_san` mang căn cứ đó — tuỳ chọn vì mẫu này dùng chung
# cho cả động sản.
#
# Mọi can_cu đã tự tra DB thật (2026-09-29):
#   SELECT duong_dan FROM provisions WHERE duong_dan ~ '^91/2015/QH13 > Điều (45[7-9]|46[0-2]|398)';
loai: hop_dong_tang_cho_tai_san
ten: "hợp đồng tặng cho tài sản"
tieu_de: "HỢP ĐỒNG TẶNG CHO TÀI SẢN"
muc_do_thieu: canh_bao

la_hop_dong: true

rules: []

can_cu_goc: "91/2015/QH13 > Điều 457"
can_cu_chi_tiet: "91/2015/QH13 > Điều 459 > Khoản 1"

khong_bat_buoc:
  can_cu: "91/2015/QH13 > Điều 462 > Khoản 1"
  ghi_chu: >
    Điều kiện tặng cho (Đ462) chỉ đặt ra khi bên tặng cho muốn kèm nghĩa vụ; quy
    định riêng về bất động sản (Đ459) chỉ đặt ra khi tài sản là bất động sản; tranh
    chấp là nội dung "có thể có" của Đ398.2. Vắng mặt không được báo là thiếu.
  keys: [dieu_kien_tang_cho, bat_dong_san, tranh_chap]

muc:
  - {stt: 1, key: tai_san_tang_cho, ten: "Tài sản tặng cho", can_cu: "91/2015/QH13 > Điều 457", tu_khoa: ["tài sản tặng cho", "đối tượng tặng cho"]}
  - {stt: 2, key: giao_nhan_hieu_luc, ten: "Giao, nhận tài sản và thời điểm có hiệu lực", can_cu: "91/2015/QH13 > Điều 458 > Khoản 1", tu_khoa: ["giao, nhận tài sản", "thời điểm có hiệu lực", "nhận tài sản tặng cho"]}
  - {stt: 3, key: khuyet_tat, ten: "Thông báo khuyết tật của tài sản", can_cu: "91/2015/QH13 > Điều 461", tu_khoa: ["khuyết tật"]}
  - {stt: 4, key: dieu_kien_tang_cho, ten: "Điều kiện tặng cho (nếu có)", can_cu: "91/2015/QH13 > Điều 462 > Khoản 1", tu_khoa: ["điều kiện tặng cho", "tặng cho có điều kiện"]}
  - {stt: 5, key: bat_dong_san, ten: "Công chứng, chứng thực, đăng ký khi tặng cho bất động sản", can_cu: "91/2015/QH13 > Điều 459 > Khoản 1", tu_khoa: ["tặng cho bất động sản", "công chứng, chứng thực", "đăng ký quyền sở hữu"]}
  - {stt: 6, key: tranh_chap, ten: "Phương thức giải quyết tranh chấp", can_cu: "91/2015/QH13 > Điều 398 > Khoản 2 > Điểm g", tu_khoa: ["giải quyết tranh chấp"]}
