# trước khi ký) đều là quy trình nội bộ của cơ quan ban hành, và văn bản thành
# phẩm không mang bằng chứng nào cho biết quy trình đó đã chạy hay chưa. Kiểm
# chúng bằng một ô tick người dùng tự khai là kiểm một lời khai bằng chính nó.
rules: []

