# Checklist THỂ THỨC của CÔNG VĂN — NĐ 30/2020 Đ8.2 a-i, chín điểm, mỗi mục
# một điểm luật riêng. Đ7 là mắt xích bắc cầu: nó liệt kê "công văn" trong danh
# sách văn bản hành chính, và chính vì thế Đ8.2 mới với tới được loại này.
#
# ══ PHẢI ĐỌC TRƯỚC KHI TIN CON SỐ COMPLETENESS CỦA MẪU NÀY ══
#
# 1. MẪU NÀY SOÁT HÌNH THỨC, KHÔNG SOÁT NỘI DUNG. NĐ 30/2020 quy định THỂ THỨC
#    (quốc hiệu, số ký hiệu, nơi nhận, chữ ký…), không quy định nghiệp vụ mà
#    một công văn phải nói. completeness 1.0 ở đây nghĩa là "đủ chín thành phần
#    thể thức", KHÔNG nghĩa là "công văn này viết đúng việc".
#
#    Khác với `noi_quy` (BLLĐ Đ118.2) hay `don_khoi_kien` (BLTTDS Đ189.4) —
#    ở hai mẫu đó luật liệt kê NỘI DUNG, nên completeness là một phát biểu về
#    chất lượng nội dung. Ở đây nó là một phát biểu về bìa thư.
#
#    Công văn là loại văn bản DUY NHẤT trong nhóm này mà giới hạn đó không phải
#    một khuyết thiếu: luật không đặt ra nội dung bắt buộc nào cho công văn —
#    thân công văn là văn xuôi tự do — nên thể thức đúng là TOÀN BỘ những gì
#    pháp luật đòi ở nó. Với `quyết định bổ nhiệm` hay `quy chế nội bộ` thì
#    ngược lại, và đó là lý do hai loại đó KHÔNG được dựng bằng Đ8.2 (xem
#    .superpowers/sdd/mo-rong-mau-report.md).
#
# 2. PHẠM VI ÁP DỤNG HẸP HƠN TÊN GỌI. Đ2.1: Nghị định này áp dụng đối với "cơ
#    quan, tổ chức nhà nước và doanh nghiệp nhà nước". Đ2.2 mở cho tổ chức
#    chính trị - xã hội "áp dụng cho phù hợp". DOANH NGHIỆP TƯ NHÂN KHÔNG NẰM
#    TRONG PHẠM VI ĐÓ: với họ, chín thành phần dưới đây là CHUẨN MỰC HÀNH CHÍNH
#    phổ biến (và là thứ cơ quan nhà nước nhận công văn mong đợi), không phải
#    một nghĩa vụ pháp lý. `muc_do_thieu: chan` bên dưới đúng cho đối tượng
#    trong phạm vi Đ2.1; với doanh nghiệp tư nhân hãy đọc nó là "lệch chuẩn",
#    không phải "trái luật".
#
# 3. PHỤ LỤC I KHÔNG CÓ TRONG KHO. Đ8.4 và Đ9 đẩy toàn bộ chi tiết trình bày
#    (khổ giấy, phông chữ, vị trí từng thành phần, và các quy tắc riêng cho
#    từng loại văn bản) sang Phụ lục I. Bản đã nạp chỉ giữ được khối ký tên của
#    Phụ lục (48 ký tự), không có nội dung. Hệ quả cụ thể: quy tắc "công văn
#    KHÔNG ghi tên loại, chỉ ghi trích yếu dưới số ký hiệu" nằm ở Phụ lục I nên
#    KHÔNG trích dẫn được. Mục `trich_yeu` dưới đây vì thế nhận trích yếu
#    ("V/v…") là đủ và không đòi thêm tên loại — đòi thêm sẽ báo thiếu cho một
#    công văn viết ĐÚNG.
#
# 4. SOÁT VĂN BẢN DÁN VÀO CHỈ ĐÚNG VỚI VĂN BẢN CÓ ĐÁNH MỤC. `extract_clauses`
#    cắt văn bản theo dòng "Thành phần N."; một công văn thật trình bày theo
#    khối trên giấy, không đánh số, nên dán nguyên vào POST /soat sẽ cho MỘT
#    khối và completeness ~1/9. Đây là giới hạn CHUNG của mọi mẫu trong repo
#    (đơn khởi kiện, biên bản họp cũng vậy), không riêng mẫu này; đường đi đúng
#    là POST /soan-thao rồi soát lại chính markdown nó trả về.
#
# Mọi can_cu đã tự tra DB thật (không chép từ trí nhớ):
#   SELECT duong_dan, noi_dung FROM provisions
#    WHERE duong_dan LIKE '30/2020/NĐ-CP > Điều 8 > Khoản 2%'
#       OR duong_dan IN ('30/2020/NĐ-CP > Điều 7', '30/2020/NĐ-CP > Điều 2 > Khoản 1');
loai: cong_van
ten: "công văn"
tieu_de: "CÔNG VĂN"

# "Thành phần", không "Điều"/"Mục": Đ8.1 gọi đúng chín thứ dưới đây là "các
# thành phần cấu thành văn bản". Đơn vị này cũng nói thẳng với người đọc rằng
# cái /soan-thao trả về là một BỘ KHUNG THỂ THỨC, không phải một công văn đã
# viết xong — gọi nó là "Điều 1." sẽ khiến nó trông như một bản hoàn chỉnh.
don_vi_muc: "Thành phần"

# `chan`: Đ8.2 dùng chữ "bao gồm các thành phần chính", không phải "có thể gồm"
# (đối chiếu BLDS Đ398.2 ở checklist hợp đồng nguyên tắc, nơi mức đúng là
# canh_bao). Đọc kèm giới hạn phạm vi số 2 ở đầu file.
# Lộ ra `GET /mau/{loai}` để frontend gắn nhãn đúng thay vì viết cứng một
# danh sách tên loại. Xem giới hạn ở đầu file: các MỤC dưới đây là thành phần
# trình bày của NĐ 30/2020 Đ8.2, không phải nội dung nghiệp vụ.
pham_vi_soat: the_thuc

muc_do_thieu: chan

# Không rule nào. NĐ 30/2020 không đặt một ngưỡng số học hay điều cấm nào có
