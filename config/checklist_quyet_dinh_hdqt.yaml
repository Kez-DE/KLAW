  - {stt: 8, key: dau_chu_ky_so, ten: "Dấu, chữ ký số của công ty", diem: h, can_cu: "30/2020/NĐ-CP > Điều 8 > Khoản 2 > Điểm h", tu_khoa: ["chữ ký số của công ty", "dấu, chữ ký số", "chữ ký số", "đóng dấu", "con dấu"]}
  - {stt: 9, key: noi_nhan, ten: "Nơi nhận", diem: i, can_cu: "30/2020/NĐ-CP > Điều 8 > Khoản 2 > Điểm i", tu_khoa: ["nơi nhận"]}
