# Checklist nội dung của HỢP ĐỒNG VAY TÀI SẢN — BLDS Đ463-470.
#
# muc_do_thieu: canh_bao. BLDS không có điều nào liệt kê nội dung bắt buộc của
# hợp đồng vay; sáu mục dưới đây là những nội dung mà từng điều luật riêng của
# chế định vay điều chỉnh. Thiếu một mục là hợp đồng SƠ SÀI, không phải TRÁI
# LUẬT — khác hẳn trần lãi suất ở `rules` bên dưới, nơi luật tuyên thẳng phần
# vượt quá "không có hiệu lực".
#
# Mọi can_cu đã tự tra DB thật (không chép từ trí nhớ):
#   SELECT duong_dan, tieu_de FROM provisions
#    WHERE duong_dan ~ '^91/2015/QH13 > Điều 46[3-9]|^91/2015/QH13 > Điều 470';
loai: hop_dong_vay
ten: "hợp đồng vay tài sản"
tieu_de: "HỢP ĐỒNG VAY TÀI SẢN"
muc_do_thieu: canh_bao

# Mẫu DUY NHẤT khai `lai_suat_vay_toi_da`. Đ468.1 chừa lối "trừ trường hợp luật
# khác có liên quan quy định khác" — hợp đồng tín dụng của tổ chức tín dụng
# không chịu trần 20%/năm này, nên rule không được lan sang mẫu nào khác.
# Dựng trên chế định HỢP ĐỒNG (BLDS Đ385 "sự thoả thuận giữa các bên"), nên
# `GET /mau/{loai}` kèm thêm khối các bên + chỗ ký (`cau_truc.khung_hop_dong`).
# Hai khối đó KHÔNG phải `muc` và KHÔNG vào mẫu số completeness.
la_hop_dong: true

rules:
  - lai_suat_vay_toi_da

can_cu_goc: "91/2015/QH13 > Điều 463"

# Đ467 mở đầu bằng "Các bên CÓ THỂ thỏa thuận về việc tài sản vay phải được sử
# dụng đúng mục đích vay" — luật tự đánh dấu là tuỳ nghi.
#
# 2026-09-29 (quyết định 2026-09-29 mục 3, nghiên cứu `hop-dong.md` §3): thêm trách
# nhiệm do vi phạm (Đ398.2.e) và giải quyết tranh chấp (Đ398.2.g, tuỳ chọn — "có thể
# có").
# Đã tự tra DB:
#   SELECT duong_dan FROM provisions WHERE duong_dan ~ '^91/2015/QH13 > Điều 398';
khong_bat_buoc:
  can_cu: "91/2015/QH13 > Điều 467"
  ghi_chu: >
    Thoả thuận về mục đích sử dụng tài sản vay là tuỳ nghi theo chính văn Đ467
    ("các bên có thể thỏa thuận"). Vắng mặt không được báo là thiếu.
    Giải quyết tranh chấp nằm trong danh mục "có thể có" của Đ398.2.
  keys: [muc_dich_su_dung, tranh_chap]

muc:
  - {stt: 1, key: tai_san_vay, ten: "Tài sản vay: số tiền hoặc tài sản cho vay", can_cu: "91/2015/QH13 > Điều 463", tu_khoa: ["tài sản vay", "tài sản cho vay", "số tiền vay", "khoản tiền vay", "đối tượng của hợp đồng vay"]}
  - {stt: 2, key: lai_suat, ten: "Lãi suất vay", can_cu: "91/2015/QH13 > Điều 468", tu_khoa: ["lãi suất"]}
  - {stt: 3, key: thoi_han_vay, ten: "Thời hạn vay và kỳ hạn trả", can_cu: "91/2015/QH13 > Điều 470", tu_khoa: ["thời hạn vay", "kỳ hạn trả", "thời hạn cho vay"]}
  - {stt: 4, key: nghia_vu_tra_no, ten: "Nghĩa vụ trả nợ của bên vay", can_cu: "91/2015/QH13 > Điều 466", tu_khoa: ["nghĩa vụ trả nợ", "hoàn trả khoản vay", "trả nợ gốc"]}
  - {stt: 5, key: nghia_vu_ben_cho_vay, ten: "Nghĩa vụ của bên cho vay", can_cu: "91/2015/QH13 > Điều 465", tu_khoa: ["nghĩa vụ của bên cho vay", "quyền và nghĩa vụ của bên cho vay"]}
  - {stt: 6, key: muc_dich_su_dung, ten: "Mục đích sử dụng tài sản vay (nếu có thoả thuận)", can_cu: "91/2015/QH13 > Điều 467", tu_khoa: ["mục đích sử dụng", "mục đích vay"]}
  - {stt: 7, key: trach_nhiem_vi_pham, ten: "Trách nhiệm do vi phạm hợp đồng", can_cu: "91/2015/QH13 > Điều 398 > Khoản 2 > Điểm e", tu_khoa: ["trách nhiệm do vi phạm", "phạt vi phạm", "bồi thường thiệt hại"]}
  - {stt: 8, key: tranh_chap, ten: "Phương thức giải quyết tranh chấp", can_cu: "91/2015/QH13 > Điều 398 > Khoản 2 > Điểm g", tu_khoa: ["giải quyết tranh chấp"]}
