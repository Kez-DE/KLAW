# HAI TRỤC phân loại văn bản (spec 2026-09-15d).
#
# Đây là DỮ LIỆU, không phải code: thêm từ khoá là sửa file này.
#
# ── Hai trục, không cạnh tranh nhau ──────────────────────────────────────────
#   * `nganh_luat` — 12 NGÀNH LUẬT, phân loại học thuật dạy trong trường luật.
#     Trích dẫn được, bảo vệ được trước hội đồng. Thô: nó GỘP MẠNH.
#   * `linh_vuc` — 27 LĨNH VỰC, phân loại thực dụng mà các cổng pháp luật dùng.
#     Mịn hơn, nên lọc retrieval tốt hơn. Không trích dẫn được như một chuẩn
#     học thuật, và đó là lý do giữ cả hai thay vì chọn một.
#
# Một văn bản mang MỘT giá trị ở mỗi trục. Cùng một bộ máy khớp từ khoá, cùng
# quy tắc `uu_tien`, chỉ khác bảng dữ liệu.
#
# Cái giá của 12 ngành: nó GỘP MẠNH. Môi trường, giao thông, y tế, giáo dục,
# quốc phòng đều là Luật Hành chính; sở hữu trí tuệ là Dân sự; doanh nghiệp,
# thương mại, đầu tư là Kinh tế. Nên `hanh_chinh` sẽ là nhóm lớn nhất và lọc
# theo nó kéo về nhiều thứ không liên quan. Đó là đánh đổi có chủ ý: chuẩn
# trích dẫn được quan trọng hơn độ mịn của bộ lọc.
#
# ── Cách nhận ────────────────────────────────────────────────────────────────
# Khớp từ khoá THEO RANH GIỚI TỪ trên `ten` + `linh_vuc` nguồn + `co_quan_ban_hanh`.
# Tất định, 0 token, giải thích được — cùng nguyên tắc `phan_loai_tai_lieu`.
#
# `uu_tien` xử lý chồng lấn: số nhỏ hơn thắng. "Bộ luật Tố tụng hình sự" khớp cả
# `hinh_su` lẫn `to_tung_hinh_su`; tố tụng cụ thể hơn nên phải thắng, nếu không
# mọi luật tố tụng rơi vào luật nội dung và bộ lọc thành vô nghĩa.

nganh_luat:
  to_tung_hinh_su:
    ten: Luật Tố tụng hình sự
    uu_tien: 1
    tu_khoa: [to tung hinh su, thi hanh an hinh su, tam giu tam giam, thi hanh tam giu, dac xa, to chuc co quan dieu tra hinh su]

  to_tung_dan_su:
    ten: Luật Tố tụng dân sự
    uu_tien: 2
    tu_khoa: [to tung dan su, to tung hanh chinh, thi hanh an dan su, trong tai thuong mai, hoa giai doi thoai tai toa an, to chuc toa an, to chuc vien kiem sat, giam dinh tu phap, thua phat lai]

  hien_phap:
    ten: Luật Hiến pháp
    uu_tien: 3
    tu_khoa: [hien phap, to chuc quoc hoi, to chuc chinh phu, chinh quyen dia phuong, bau cu, trung cau y dan, mat tran to quoc, to chuc chinh quyen do thi]

  hon_nhan_gia_dinh:
    ten: Luật Hôn nhân và gia đình
    uu_tien: 4
    tu_khoa: [hon nhan, hon nhan va gia dinh, gia dinh, nuoi con nuoi, tre em, binh dang gioi, phong chong bao luc gia dinh, ho tich]

  lao_dong:
    ten: Luật Lao động
    uu_tien: 5
    tu_khoa: [lao dong, viec lam, tien luong, bao hiem xa hoi, bao hiem that nghiep, an toan ve sinh lao dong, cong doan, giao duc nghe nghiep, nguoi lao dong viet nam di lam viec o nuoc ngoai, cong nhan vien chuc lao dong]

  dat_dai:
    ten: Luật Đất đai
    uu_tien: 6
    tu_khoa: [dat dai, nha o, bat dong san, kinh doanh bat dong san, luat xay dung, hoat dong xay dung, quy hoach do thi, quy hoach su dung dat, kien truc, dang ky dat dai, thu hoi dat, boi thuong tai dinh cu]

  ngan_hang:
    ten: Luật Ngân hàng
    uu_tien: 7
    tu_khoa: [ngan hang, ngan hang nha nuoc, to chuc tin dung, tin dung, bao hiem tien gui, ngoai hoi, thanh toan khong dung tien mat, phong chong rua tien]

  tai_chinh:
    ten: Luật Tài chính
    uu_tien: 8
    tu_khoa: [thue, quan ly thue, ke toan, kiem toan, ngan sach nha nuoc, phi le phi, quan ly gia, binh on gia, du tru quoc gia, quan ly no cong, tai san cong, chung khoan, kinh doanh bao hiem]

  kinh_te:
    ten: Luật Kinh tế
    uu_tien: 9
    tu_khoa: [doanh nghiep, dau tu, thuong mai, pha san, canh tranh, hop tac xa, dau thau, so huu tri tue, bao ve quyen loi nguoi tieu dung, quang cao, gia cong, logistics, hai quan, xuat nhap khau]

  hinh_su:
    ten: Luật Hình sự
    uu_tien: 10
    tu_khoa: [hinh su, toi pham, hinh phat, trach nhiem hinh su, phong chong ma tuy, phong chong mua ban nguoi, phong chong tham nhung]

  dan_su:
    ten: Luật Dân sự
    uu_tien: 11
    tu_khoa: [dan su, tai san, nghia vu, hop dong, thua ke, boi thuong thiet hai, cong chung, chung thuc, trach nhiem boi thuong cua nha nuoc, quoc tich, cu tru, ho tich tu phap]

  hanh_chinh:
    ten: Luật Hành chính
    uu_tien: 12
    tu_khoa: [hanh chinh, thu tuc hanh chinh, can bo cong chuc, vien chuc, khieu nai, to cao, xu ly vi pham hanh chinh, thanh tra, tiep cong dan, luu tru, van thu, ban hanh van ban quy pham phap luat, giao thong, duong bo, duong sat, hang hai, hang khong, van tai, y te, kham benh chua benh, duoc, bao hiem y te, an toan thuc pham, dan so, giao duc, dai hoc, khoa hoc va cong nghe, moi truong, tai nguyen, khoang san, tai nguyen nuoc, lam nghiep, thuy san, da dang sinh hoc, bien va hai dao, khi tuong thuy van, quoc phong, an ninh quoc gia, cong an, bien phong, canh sat bien, nghia vu quan su, xuat canh, nhap canh, dieu uoc quoc te, co yeu, cong nghe thong tin, giao dich dien tu, du lieu ca nhan, an toan thong tin mang, vien thong, tan so, chuyen giao cong nghe, cong nghe cao]

# ── Trục 2: 27 lĩnh vực ───────────────────────────────────────────────────────
