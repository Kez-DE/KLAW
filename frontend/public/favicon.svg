<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="KLAW">
  <title>KLAW</title>
  <!--
    Mã nhãn KLAW: một khung phim đang được rọi sáng (DESIGN.md § "Mã nhãn — KLAW").

    KHÔNG có khía răng cưa ở đây, có chủ đích. Đã rasterise ở 16px rồi phóng
    nearest-neighbour để nhìn: khía biến hai cạnh dọc thành bàn cờ xám, khung
    không còn đọc ra là khung. DESIGN.md đã nói trước điều này — "nếu phải nhìn
    kỹ mới thấy răng cưa thì răng cưa bị bỏ ở kích thước đó, không thu nhỏ tiếp".
    Bản đầy đủ có khía nằm ở `src/brand/MaNhan.tsx`, tự bật từ 20px trở lên.

    Nền trong suốt; nét khung đảo theo chủ đề của trình duyệt để sống được trên
    cả thanh tab sáng lẫn tối. Trình duyệt bỏ qua media query sẽ nhận nét tối,
    là trường hợp phổ biến hơn.
  -->
  <style>
    .khung { stroke: #1A1611 }
    @media (prefers-color-scheme: dark) { .khung { stroke: #F3EEE3 } }
  </style>
  <defs>
    <radialGradient id="den-may">
      <stop offset="0" stop-color="#F0BC5A" stop-opacity="1"/>
      <stop offset=".58" stop-color="#F0BC5A" stop-opacity="1"/>
      <stop offset=".76" stop-color="#F0BC5A" stop-opacity=".5"/>
      <stop offset="1" stop-color="#F0BC5A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect class="khung" x="4" y="4" width="24" height="24" rx="4" fill="none" stroke-width="2.5"/>
  <circle cx="13.5" cy="13.5" r="6.8" fill="url(#den-may)"/>
</svg>
